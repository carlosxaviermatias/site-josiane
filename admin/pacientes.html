<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Puericultura — Josiane Tavares</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde-900:#0B1F17; --verde-800:#12352A; --verde-600:#1E5340; --verde-400:#4A8570;
    --areia:#F7F3EC; --areia-2:#EFE7DA; --areia-3:#E3D8C6;
    --rose:#B87F6C; --texto:#17251F; --texto-suave:#5D6E66;
    --ocre:#CA8A04; --ocre-bg:#FEF3C7;
    --erro:#DC2626; --erro-bg:#FEE2E2;
    --verde-sinal:#15803D;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',sans-serif; font-size:15px; background:var(--areia); color:var(--texto); }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; font-weight:400; margin:0 0 .5em; }

  /* login */
  #login { min-height:100vh; display:grid; place-items:center; padding:2rem; background:var(--verde-800); }
  .login-card { width:min(400px,100%); background:var(--areia); padding:3rem 2.5rem; border-radius:4px; }
  .login-card h1 { font-size:1.7rem; color:var(--verde-800); }
  .login-card p { color:var(--texto-suave); font-size:.9rem; margin:0 0 2rem; }

  /* app */
  #app { display:none; min-height:100vh; }
  #app.ativo { display:block; }
  .topo {
    background:var(--verde-900); color:var(--areia);
    padding:1.1rem clamp(1.2rem,4vw,2.5rem);
    display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  }
  .topo .marca strong { font-family:'Fraunces',serif; font-weight:400; font-size:1.25rem; display:block; }
  .topo .marca span { font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--rose); }
  .topo nav { display:flex; gap:1.4rem; align-items:center; font-size:.85rem; }
  .topo nav a { color:rgba(247,243,236,.65); text-decoration:none; }
  .topo nav a:hover { color:var(--areia); }

  .abas-pill { display:flex; gap:.5rem; flex-wrap:wrap; padding:1.4rem clamp(1.2rem,4vw,2.5rem) 0; }
  .abas-pill button {
    font:inherit; font-size:.82rem; font-weight:600;
    padding:.55rem 1.15rem; border-radius:100px; cursor:pointer;
    background:transparent; border:1px solid var(--areia-3); color:var(--texto-suave);
    transition:180ms;
  }
  .abas-pill button:hover { border-color:var(--verde-400); color:var(--verde-600); }
  .abas-pill button.ativa { background:var(--verde-800); border-color:var(--verde-800); color:var(--areia); }
  .abas-pill .badge {
    display:inline-grid; place-content:center; min-width:19px; height:19px;
    border-radius:100px; background:var(--rose); color:#fff;
    font-size:.68rem; margin-left:.45rem; padding:0 .3rem;
  }

  main { padding:1.6rem clamp(1.2rem,4vw,2.5rem) 5rem; max-width:1080px; }

  /* cards e blocos */
  .cartoes { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--areia-3); border:1px solid var(--areia-3); border-radius:4px; overflow:hidden; margin-bottom:1.5rem; }
  .cartao { background:#fff; padding:1.2rem 1.3rem; }
  .cartao span { display:block; font-size:.64rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--texto-suave); margin-bottom:.4rem; }
  .cartao strong { font-family:'Fraunces',serif; font-weight:400; font-size:1.9rem; }
  .cartao small { display:block; font-size:.75rem; color:var(--texto-suave); }
  .cor-verde strong { color:var(--verde-600); }
  .cor-ocre strong { color:var(--ocre); }
  .cor-erro strong { color:var(--erro); }

  .bloco { background:#fff; border:1px solid var(--areia-3); border-radius:4px; padding:1.6rem; margin-bottom:1.3rem; }
  .bloco-topo { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .bloco-topo h2 { font-size:1.3rem; margin:0; }
  .dica { font-size:.78rem; color:var(--texto-suave); }

  /* chips de situação */
  .chip { font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:.28rem .65rem; border-radius:100px; white-space:nowrap; }
  .chip.completa  { background:var(--verde-600); color:#fff; }
  .chip.no-prazo  { background:#DCE9E1; color:var(--verde-600); }
  .chip.apertado  { background:var(--ocre-bg); color:var(--ocre); }
  .chip.risco     { background:var(--erro-bg); color:var(--erro); }
  .chip.encerrada { background:var(--areia-2); color:var(--texto-suave); }

  /* checklist */
  .check-item {
    display:grid; grid-template-columns:auto 1fr auto; gap:1rem; align-items:center;
    padding:.95rem 1.1rem; border:1px solid var(--areia-3); border-radius:4px;
    margin-bottom:.6rem; background:var(--areia); transition:160ms;
  }
  .check-item.ok       { border-color:#BFD4C7; background:#EDF5F0; }
  .check-item.apertado { border-color:#E3CD9C; background:var(--ocre-bg); }
  .check-item.perdido  { border-color:#E0BBAC; background:var(--erro-bg); }
  .marca-ok {
    width:26px; height:26px; border-radius:50%; display:grid; place-content:center;
    border:2px solid var(--areia-3); background:#fff;
    font-size:.85rem; font-weight:700; color:transparent;
  }
  .check-item.ok .marca-ok      { background:var(--verde-600); border-color:var(--verde-600); color:#fff; }
  .check-item.perdido .marca-ok { background:var(--erro); border-color:var(--erro); color:#fff; }
  .check-txt strong { display:block; font-size:.95rem; font-weight:600; }
  .check-txt small  { display:block; font-size:.78rem; color:var(--texto-suave); margin-top:.15rem; }
  .check-item.perdido .check-txt small { color:var(--erro); }
  .check-item.apertado .check-txt small { color:var(--ocre); }

  .contador { display:flex; align-items:center; gap:.35rem; }
  .contador button {
    width:31px; height:31px; border-radius:4px; border:1px solid var(--areia-3);
    background:#fff; font:inherit; font-size:1.05rem; line-height:1; cursor:pointer; color:var(--texto-suave);
  }
  .contador button:hover:not(:disabled) { border-color:var(--verde-600); color:var(--verde-600); }
  .contador button:disabled { opacity:.35; cursor:default; }
  .contador b { min-width:56px; text-align:center; font-family:'Fraunces',serif; font-weight:400; font-size:1.15rem; }

  .vac-linha { display:flex; gap:.5rem; flex-wrap:wrap; }
  .vac-chip {
    font:inherit; font-size:.8rem; font-weight:600; padding:.5rem 1rem;
    border-radius:100px; border:1px solid var(--areia-3); background:#fff;
    color:var(--texto-suave); cursor:pointer; transition:150ms;
  }
  .vac-chip:hover { border-color:var(--verde-400); }
  .vac-chip.on { background:var(--verde-600); border-color:var(--verde-600); color:#fff; }

  /* barras */
  .trilho { background:var(--areia-2); border-radius:100px; overflow:hidden; }
  .trilho i { display:block; height:100%; border-radius:100px; transition:width 600ms cubic-bezier(.22,.61,.36,1); }
  .barra-lin { display:grid; grid-template-columns:1fr auto; gap:.4rem 1rem; align-items:center; padding:.85rem 0; border-bottom:1px solid var(--areia-2); }
  .barra-lin:last-child { border-bottom:0; }
  .barra-lin.linha { transition:120ms; margin:0 -.6rem; padding-left:.6rem; padding-right:.6rem; border-radius:4px; }
  .barra-lin.linha:hover, div.linha:hover { background:var(--areia); }
  div.linha { transition:120ms; }

  /* tabela */
  .tabela-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th { text-align:left; font-size:.66rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--texto-suave); padding:.6rem .8rem; border-bottom:1px solid var(--areia-3); }
  td { padding:.85rem .8rem; border-bottom:1px solid var(--areia-2); vertical-align:middle; }
  tr.linha { cursor:pointer; transition:120ms; }
  tr.linha:hover { background:var(--areia); }
  .pontos { font-family:'Fraunces',serif; font-size:1.15rem; }
  .pastilhas { display:flex; gap:4px; }
  .pastilhas i { width:16px; height:8px; border-radius:2px; background:var(--areia-2); }
  .pastilhas i.on { background:var(--verde-600); }
  .pastilhas i.mal { background:#E0BBAC; }

  /* formulários */
  .campo { margin-bottom:1.1rem; }
  .campo label { display:block; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-suave); margin-bottom:.4rem; }
  input, select, textarea {
    width:100%; padding:.68rem .85rem; font:inherit; font-size:.92rem;
    background:#fff; border:1px solid var(--areia-3); border-radius:3px; color:var(--texto);
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--verde-400); box-shadow:0 0 0 3px rgba(74,133,112,.14); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 1.2rem; }
  @media (max-width:640px){ .grid2 { grid-template-columns:1fr; } }

  button.btn {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.68rem 1.35rem; font:inherit; font-size:.74rem; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase;
    border:1px solid transparent; border-radius:3px; cursor:pointer; transition:160ms;
  }
  .btn-verde { background:var(--verde-800); color:var(--areia); }
  .btn-verde:hover { background:var(--verde-600); }
  .btn-linha { background:transparent; border-color:var(--areia-3); color:var(--texto-suave); }
  .btn-linha:hover { border-color:var(--verde-600); color:var(--verde-600); }
  .btn-remover { background:transparent; border-color:#E0BBAC; color:var(--erro); padding:.4rem .8rem; font-size:.66rem; }
  .btn-remover:hover { background:var(--erro-bg); }

  #aviso-toast {
    position:fixed; right:1.5rem; bottom:1.5rem; z-index:50;
    padding:.9rem 1.4rem; border-radius:3px; font-size:.88rem; font-weight:500;
    background:var(--verde-800); color:var(--areia);
    box-shadow:0 12px 30px rgba(11,31,23,.25);
    opacity:0; transform:translateY(12px); pointer-events:none; transition:220ms;
  }
  #aviso-toast.visivel { opacity:1; transform:translateY(0); }
  #aviso-toast.erro { background:var(--erro); }

  /* botão de exportar, no canto do bloco */
  .btn-pdf {
    font:inherit; font-size:.7rem; font-weight:600; letter-spacing:.06em;
    padding:.45rem .9rem; border-radius:100px; cursor:pointer;
    background:#fff; border:1px solid var(--areia-3); color:var(--texto-suave);
    display:inline-flex; align-items:center; gap:.35rem; transition:150ms; white-space:nowrap;
  }
  .btn-pdf:hover { border-color:var(--verde-600); color:var(--verde-600); }

  /* ── Celular ───────────────────────────────────────────────────────
     As tabelas têm 6-7 colunas e não cabem numa tela de 375px: em vez de
     obrigar o scroll lateral, cada linha vira um cartão com os rótulos ao
     lado do valor (os rótulos são copiados do <thead> por JS). */
  @media (max-width:720px) {
    body { font-size:14px; }
    main { padding:1.1rem 1rem 4rem; }
    .topo { padding:.9rem 1rem; }
    .topo nav { gap:1rem; font-size:.8rem; }
    .abas-pill { padding:1rem 1rem 0; gap:.4rem; }
    .abas-pill button { padding:.6rem 1rem; font-size:.8rem; }
    .bloco { padding:1.1rem; }
    .bloco-topo { gap:.6rem; }
    .bloco-topo h2 { font-size:1.15rem; }
    .cartoes { grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
    .cartao { padding:1rem; }
    .cartao strong { font-size:1.6rem; }

    .tabela-wrap { overflow-x:visible; }
    table, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tr {
      border:1px solid var(--areia-3); border-radius:5px;
      margin-bottom:.7rem; padding:.35rem .2rem; background:#fff;
    }
    tr.linha:hover { background:var(--areia); }
    td {
      display:flex; align-items:center; justify-content:space-between; gap:1rem;
      border-bottom:1px solid var(--areia-2); padding:.55rem .7rem; text-align:right;
    }
    tr td:last-child { border-bottom:0; }
    td::before {
      content:attr(data-rotulo);
      font-size:.63rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      color:var(--texto-suave); text-align:left; flex:0 0 auto; max-width:45%;
    }
    td .pastilhas { justify-content:flex-end; }
    input, select, textarea { font-size:16px; }  /* evita o zoom automático do iOS */
    #aviso-toast { right:1rem; left:1rem; bottom:1rem; text-align:center; }
  }

  /* ── Impressão / PDF ───────────────────────────────────────────────
     A janela de exportação já monta um documento limpo; estas regras cobrem
     o caso de alguém imprimir a página inteira direto do navegador. */
  @media print {
    .topo, .abas-pill, #aviso-toast, .btn-pdf, .btn, input[type="search"] { display:none !important; }
    body { background:#fff; font-size:11pt; }
    .bloco { border:1px solid #999; break-inside:avoid; page-break-inside:avoid; }
    tr { break-inside:avoid; page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" onsubmit="entrar(event)">
    <h1>Puericultura</h1>
    <p>Checklist das consultas até 2 anos. Área restrita.</p>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required />
    </div>
    <button class="btn btn-verde" style="width:100%; justify-content:center" type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <div class="topo">
    <div class="marca">
      <strong>Puericultura</strong>
      <span>Josiane Tavares · Enfermeira</span>
    </div>
    <nav>
      <a href="/admin">Painel do site</a>
      <a href="/" target="_blank">Ver o site</a>
      <a href="#" onclick="sair(); return false" style="color:var(--rose)">Sair</a>
    </nav>
  </div>
  <div class="abas-pill" id="abas"></div>
  <main id="conteudo"></main>
</div>

<input type="file" id="input-csv" accept=".csv" style="display:none" onchange="importarCSV(this.files[0])" />
<div id="aviso-toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Checklist de puericultura até 2 anos.

   Espelha o relatório oficial "Lista de Crianças (Desenvolvimento
   Infantil)": 5 critérios de 0,20 cada, somando a pontuação de 0 a 1.
   Peso e altura não são digitados aqui — só a CONTAGEM de consultas
   que tiveram medida, que é o que o indicador cobra.
   ════════════════════════════════════════════════════════════════ */

const PRAZO_2A   = 730;   // dias de vida em que a criança completa 2 anos
const META_CONS  = 9;     // consultas de puericultura até 2 anos
const PRAZO_30D  = 30;    // 1ª consulta e 1ª visita domiciliar

// Soma meses/dias de calendário à data de nascimento e devolve em qual dia de
// vida aquele marco cai. Usa o dia do mês "grudado" no limite do mês de
// destino (31/jan + 1 mês = 28/fev, não 3/mar) pra não sofrer do rollover
// automático do Date do JS.
function diasAoCompletar(nascISO, meses, diasExtras = 0) {
  const [ano, mes, dia] = nascISO.split('-').map(Number);
  const nascimento = new Date(ano, mes - 1, dia);
  let novoMes = (mes - 1) + meses;
  const novoAno = ano + Math.floor(novoMes / 12);
  novoMes = ((novoMes % 12) + 12) % 12;
  const ultimoDiaMes = new Date(novoAno, novoMes + 1, 0).getDate();
  const alvo = new Date(novoAno, novoMes, Math.min(dia, ultimoDiaMes));
  alvo.setDate(alvo.getDate() + diasExtras);
  return Math.round((alvo - nascimento) / 86400000);
}

const VACINAS = [
  { id:'pneumo10v', rotulo:'Pneumo 10V' },
  { id:'penta',     rotulo:'Pentavalente' },
  { id:'vip',       rotulo:'VIP' },
  { id:'scr',       rotulo:'Tríplice viral' }
];

const CRITERIOS = [
  { id:'vis30d',   rotulo:'Visita domiciliar até 30 dias' },
  { id:'vis6m',    rotulo:'Visita domiciliar aos 6 meses' },
  { id:'cons30d',  rotulo:'1ª consulta até 30 dias de vida' },
  { id:'cons2a',   rotulo:'9 consultas até 2 anos' },
  { id:'pesalt2a', rotulo:'9 consultas com peso e altura' },
  { id:'vacinas',  rotulo:'Vacinas do calendário em dia' }
];
const PESO_CRITERIO = 1 / CRITERIOS.length;

let P = null, VIEW = 'visao', SEL = null, EDITANDO = null, BUSCA = '', FILTRO_MICRO = null, FILTRO_STATUS = null,
    FILTRO_CRITERIO = null, FILTRO_PONTUACAO = null;

// Zera os outros filtros antes de aplicar um novo — só um por vez, senão a
// combinação vira confusão ("cons2a pendente" + "microárea 03" ao mesmo tempo).
function irParaLista(tipo, valor) {
  FILTRO_MICRO = null; FILTRO_STATUS = null; FILTRO_CRITERIO = null; FILTRO_PONTUACAO = null;
  if (tipo === 'micro') FILTRO_MICRO = valor;
  else if (tipo === 'status') FILTRO_STATUS = valor;
  else if (tipo === 'criterio') FILTRO_CRITERIO = valor;
  else if (tipo === 'pontuacao') FILTRO_PONTUACAO = valor;
  VIEW = 'lista'; SEL = null; BUSCA = '';
  render();
  window.scrollTo(0, 0);
}

// Formato escolhido para cada gráfico (a escolha sobrevive ao re-render).
let GRAFICO = { criterios: 'barras', pontuacao: 'barras', micro: 'barras' };

const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataISO = d => d.toISOString().slice(0,10);
const fmt = iso => { const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; };
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const corPct = v => v >= 70 ? '#15803D' : v >= 40 ? '#CA8A04' : '#DC2626';
const dias = n => n + (Math.abs(n) === 1 ? ' dia' : ' dias');

/* ── Gráficos em SVG ───────────────────────────────────────────────
   Desenhados à mão, sem biblioteca: nada é baixado de fora e o mesmo
   SVG vai junto na exportação em PDF. Cores literais (e não variáveis
   CSS) porque a janela de impressão não carrega o :root daqui. */
const CINZA_TRILHO = '#EFE7DA';

function svgPizza(fatias, tam = 200) {
  const usadas = fatias.filter(f => f.valor > 0);
  const total = usadas.reduce((s, f) => s + f.valor, 0);
  if (!total) return '<p class="dica">Sem dados para o gráfico.</p>';
  const r = tam / 2;

  // f.onClique, quando presente, é uma chamada JS pronta (ex.: "irParaLista('pontuacao',3)").
  const atrClique = f => f.onClique ? ` style="cursor:pointer" onclick="${f.onClique}"` : '';

  // Uma fatia só = círculo inteiro: o arco degenera quando início e fim coincidem.
  if (usadas.length === 1) {
    return `<svg viewBox="0 0 ${tam} ${tam}" width="${tam}" height="${tam}" role="img">
      <circle cx="${r}" cy="${r}" r="${r}" fill="${usadas[0].cor}"${atrClique(usadas[0])}></circle></svg>`;
  }

  let ang = -Math.PI / 2;   // começa no topo
  const partes = usadas.map(f => {
    const abertura = (f.valor / total) * Math.PI * 2;
    const x1 = r + r * Math.cos(ang), y1 = r + r * Math.sin(ang);
    ang += abertura;
    const x2 = r + r * Math.cos(ang), y2 = r + r * Math.sin(ang);
    const arcoGrande = abertura > Math.PI ? 1 : 0;
    return `<path d="M ${r} ${r} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${arcoGrande} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"
      fill="${f.cor}" stroke="#fff" stroke-width="1.5"${atrClique(f)}><title>${esc(f.rotulo)}: ${f.valor}</title></path>`;
  }).join('');

  return `<svg viewBox="0 0 ${tam} ${tam}" width="${tam}" height="${tam}" role="img">${partes}</svg>`;
}

function legendaPizza(fatias) {
  const total = fatias.reduce((s, f) => s + f.valor, 0) || 1;
  return `<div style="display:flex; flex-direction:column; gap:.2rem; min-width:170px">
    ${fatias.filter(f => f.valor > 0).map(f => `
      <div class="${f.onClique ? 'linha' : ''}" style="display:flex; align-items:center; gap:.55rem; font-size:.84rem; padding:.25rem .4rem; margin:0 -.4rem; border-radius:4px; ${f.onClique ? 'cursor:pointer' : ''}"
        ${f.onClique ? `onclick="${f.onClique}" title="Ver essas crianças"` : ''}>
        <i style="width:12px; height:12px; border-radius:3px; background:${f.cor}; flex:0 0 auto"></i>
        <span style="flex:1">${esc(f.rotulo)}</span>
        <strong>${f.valor}</strong>
        <small style="color:var(--texto-suave); min-width:38px; text-align:right">${Math.round(f.valor / total * 100)}%</small>
      </div>`).join('')}
  </div>`;
}

function svgRosca(percentual, cor, tam = 108) {
  const r = tam / 2, raio = r - 10, circ = 2 * Math.PI * raio;
  const cheio = Math.max(0, Math.min(100, percentual)) / 100 * circ;
  return `<svg viewBox="0 0 ${tam} ${tam}" width="${tam}" height="${tam}" role="img">
    <circle cx="${r}" cy="${r}" r="${raio}" fill="none" stroke="${CINZA_TRILHO}" stroke-width="12"></circle>
    <circle cx="${r}" cy="${r}" r="${raio}" fill="none" stroke="${cor}" stroke-width="12"
      stroke-dasharray="${cheio.toFixed(2)} ${(circ - cheio).toFixed(2)}"
      stroke-linecap="round" transform="rotate(-90 ${r} ${r})"></circle>
    <text x="${r}" y="${r}" text-anchor="middle" dominant-baseline="central"
      font-family="Fraunces,Georgia,serif" font-size="${(tam * 0.24).toFixed(1)}" fill="${cor}">${percentual}%</text>
  </svg>`;
}

/* Botõezinhos para trocar o formato do gráfico. */
function alternador(chave, opcoes) {
  return `<div style="display:inline-flex; gap:.3rem">
    ${opcoes.map(o => `
      <button class="btn-pdf" style="${GRAFICO[chave] === o.id
          ? 'background:var(--verde-800); border-color:var(--verde-800); color:var(--areia)' : ''}"
        onclick="GRAFICO['${chave}']='${o.id}'; render()">${o.rotulo}</button>`).join('')}
  </div>`;
}

function diasDeVida(nasc) {
  return Math.round((HOJE - new Date(nasc + 'T00:00:00')) / 86400000);
}

function idadeTxt(d) {
  if (d < 0) return '—';
  if (d < 60) return dias(d);
  const m = Math.floor(d / 30.44);
  if (m < 24) return m + ' meses';
  const a = Math.floor(m / 12), r = m % 12;
  return a + (a > 1 ? ' anos' : ' ano') + (r ? ` e ${r} m` : '');
}

const num = (c, k) => Math.max(0, Number(c[k]) || 0);

/* Um item do checklist. `restam` é quanto falta do prazo, em dias.
   apertado = ainda dá, mas sobra menos de 30 dias por consulta faltante. */
function item(id, rotulo, feito, meta, restam, un) {
  const ok = feito >= meta;
  const faltam = Math.max(0, meta - feito);
  const quantas = `falta${faltam > 1 ? 'm' : ''} ${faltam} ${faltam > 1 ? un[1] : un[0]}`;
  let st = 'ok', nota;
  if (ok) {
    nota = 'cumprido';
  } else if (restam <= 0) {
    st = 'perdido';
    nota = `prazo vencido há ${dias(-restam)} — ${quantas}`;
  } else {
    const folga = restam / faltam;
    st = folga < 30 ? 'apertado' : 'aberto';
    nota = `${quantas} · ${dias(restam)} de prazo`;
  }
  return { id, rotulo, feito, meta, faltam, restam, st, ok, nota };
}

function avaliar(c) {
  const idade = diasDeVida(c.nascimento);
  const ate2a = PRAZO_2A - idade;
  const vac = c.vacinas || {};
  const vacFeitas = VACINAS.filter(v => vac[v.id]).length;

  // Marcos de calendário da visita de 6 meses: começa a valer quando a criança
  // completa 6 meses, prazo máximo é 6 meses e 29 dias.
  const inicio6m = diasAoCompletar(c.nascimento, 6);
  const fim6m29d = diasAoCompletar(c.nascimento, 6, 29);

  // Visita domiciliar até 30 dias — critério próprio do ACS, prazo irrecuperável aos 30 dias.
  const vis30item = item('vis30d', 'Visita domiciliar até 30 dias',
    num(c,'vis30d') ? 1 : 0, 1, PRAZO_30D - idade, ['visita','visitas']);
  // Visita domiciliar aos 6 meses — critério próprio do ACS, prazo máximo 6 meses e 29 dias.
  const vis6item = item('vis6m', 'Visita domiciliar aos 6 meses',
    num(c,'vis6m') ? 1 : 0, 1, fim6m29d - idade, ['visita','visitas']);
  vis6item.inicio6m = inicio6m;
  vis6item.fim6m29d = fim6m29d;

  const itens = [
    vis30item,
    vis6item,
    item('cons30d',  '1ª consulta até 30 dias de vida',  num(c,'cons30d') ? 1 : 0, 1, PRAZO_30D - idade, ['consulta','consultas']),
    item('cons2a',   '9 consultas até 2 anos',           num(c,'cons2a'),   META_CONS, ate2a, ['consulta','consultas']),
    item('pesalt2a', '9 consultas com peso e altura',    num(c,'pesalt2a'), META_CONS, ate2a, ['com medida','com medida']),
    item('vacinas',  'Vacinas do calendário em dia',     vacFeitas, VACINAS.length, ate2a, ['vacina','vacinas'])
  ];

  const cumpridos = itens.filter(i => i.ok).length;
  const pontuacao = cumpridos * PESO_CRITERIO;

  let status;
  if (cumpridos === itens.length) status = 'completa';
  else if (ate2a <= 0) status = 'encerrada';
  else if (itens.some(i => i.st === 'perdido')) status = 'risco';
  else if (itens.some(i => i.st === 'apertado')) status = 'apertado';
  else status = 'no-prazo';

  return { idade, ate2a, itens, cumpridos, pontuacao, status,
           por: Object.fromEntries(itens.map(i => [i.id, i])) };
}

const ROTULO_STATUS = {
  completa:'Completa', 'no-prazo':'No prazo', apertado:'Apertado',
  risco:'Em risco', encerrada:'Encerrada'
};

/* O que fazer primeiro: item aberto com menos folga por unidade faltante. */
function proximoPasso(av) {
  const abertos = av.itens.filter(i => !i.ok);
  if (!abertos.length) return 'Nada pendente — pontuação cheia.';
  const p = [...abertos].sort((a, b) => {
    if ((a.restam <= 0) !== (b.restam <= 0)) return a.restam <= 0 ? 1 : -1;
    return (a.restam / a.faltam) - (b.restam / b.faltam);
  })[0];
  return `${p.rotulo} — ${p.nota}`;
}

/* ── Sessão e dados ────────────────────────────────────────────── */
async function entrar(ev) {
  ev.preventDefault();
  const r = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ senha: document.getElementById('senha').value })
  });
  if (r.ok) carregar();
  else toast('Senha incorreta.', true);
}

async function sair() { await fetch('/api/logout', { method:'POST' }); location.reload(); }

async function carregar() {
  const r = await fetch('/api/admin/pacientes');
  if (!r.ok) return;
  P = await r.json();
  if (!Array.isArray(P.criancas)) P.criancas = [];
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('ativo');
  render();
}

async function salvar() {
  const r = await fetch('/api/admin/pacientes', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(P)
  });
  if (!r.ok) toast('Erro ao salvar.', true);
}

function toast(msg, erro = false) {
  const t = document.getElementById('aviso-toast');
  t.textContent = msg;
  t.className = 'visivel' + (erro ? ' erro' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => (t.className = ''), 2400);
}

/* ── Render ────────────────────────────────────────────────────── */
function render() {
  const pendentes = P.criancas.filter(c => {
    const s = avaliar(c).status;
    return s === 'apertado' || s === 'risco';
  }).length;

  document.getElementById('abas').innerHTML = `
    <button class="${VIEW==='visao'?'ativa':''}" onclick="VIEW='visao'; SEL=null; render()">
      Onde estou${pendentes ? `<span class="badge">${pendentes}</span>` : ''}
    </button>
    <button class="${VIEW==='lista'||VIEW==='crianca'?'ativa':''}" onclick="FILTRO_MICRO=null; FILTRO_STATUS=null; FILTRO_CRITERIO=null; FILTRO_PONTUACAO=null; VIEW='lista'; SEL=null; render()">Crianças</button>
    <button class="${VIEW==='micro'?'ativa':''}" onclick="VIEW='micro'; render()">Microáreas</button>
    <button class="${VIEW==='form'?'ativa':''}" onclick="VIEW='form'; EDITANDO=null; render()">+ Cadastrar</button>
    <button onclick="document.getElementById('input-csv').click()">⇪ Importar CSV do e-SUS</button>`;

  const alvo = document.getElementById('conteudo');
  if (VIEW === 'visao') alvo.innerHTML = telaVisao();
  else if (VIEW === 'lista') alvo.innerHTML = telaLista();
  else if (VIEW === 'micro') alvo.innerHTML = telaMicro();
  else if (VIEW === 'form') alvo.innerHTML = telaForm();
  else if (VIEW === 'crianca') alvo.innerHTML = telaCrianca();

  rotularCelulas();
}

/* No celular a tabela vira cartão e o <thead> some, então cada célula carrega
   o próprio rótulo. Copiamos do cabeçalho aqui, uma vez por render, em vez de
   repetir data-rotulo em toda a montagem de HTML. */
function rotularCelulas() {
  document.querySelectorAll('#conteudo table').forEach(tabela => {
    const rotulos = [...tabela.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (!rotulos.length) return;
    tabela.querySelectorAll('tbody tr').forEach(tr => {
      [...tr.children].forEach((td, i) => {
        if (rotulos[i]) td.setAttribute('data-rotulo', rotulos[i]);
      });
    });
  });
}

/* ── Onde estou ────────────────────────────────────────────────── */
function telaVisao() {
  const avs = P.criancas.map(c => ({ c, av: avaliar(c) }));
  const n = avs.length;

  const indicadores = CRITERIOS.map(cr => {
    const feito = avs.filter(x => x.av.por[cr.id].ok).length;
    return { ...cr, feito, valor: pct(feito, n) };
  });
  const geral = n ? Math.round(indicadores.reduce((s, i) => s + i.valor, 0) / CRITERIOS.length) : 0;
  const media = n ? avs.reduce((s, x) => s + x.av.pontuacao, 0) / n : 0;

  const emRisco  = avs.filter(x => x.av.status === 'risco').length;
  const apertado = avs.filter(x => x.av.status === 'apertado').length;
  const prazos   = avs.map(x => x.av.ate2a).filter(d => d > 0);
  const maisCurto = prazos.length ? Math.min(...prazos) : null;

  // distribuição de pontuação, igual à coluna do relatório oficial

    k,
    rotulo: (k * PESO_CRITERIO).toFixed(2).replace('.', ','),
    n: avs.filter(x => x.av.cumpridos === k).length

  const maxFaixa = Math.max(1, ...faixas.map(f => f.n));

  const fila = avs.filter(x => x.av.cumpridos < 5)
    .sort((a, b) => a.av.ate2a - b.av.ate2a)

  // está aberta (0 a 30 dias de vida). Depois de vencida, o dado já era: sai da lista.

  // e enquanto ainda não passou do prazo máximo (6 meses e 29 dias); depois disso, sai da lista.
  const pendentes6m = avs.filter(x =>
      num(x.c, 'vis6m') === 0 &&
      x.av.idade >= x.av.por.vis6m.inicio6m &&
      x.av.idade <= x.av.por.vis6m.fim6m29d)

  const urgentes6m = pendentes6m.filter(x => (x.av.por.vis6m.fim6m29d - x.av.idade) <= 7);

      <div class="cartao cor-verde"><span>Pontuação média</span><strong>${media.toFixed(2).replace('.',',')}</strong><small>de 1,00 possível</small></div>
      <div class="cartao cor-ocre" style="cursor:pointer" onclick="irParaLista('status','prazo')" title="Ver crianças com prazo em aberto, da mais urgente pra menos"><span>Prazo mais curto</span><strong>${maisCurto ?? '—'}</strong><small>${maisCurto != null ? 'dias para os 2 anos' : 'nenhum prazo aberto'}</small></div>
      <div class="cartao cor-erro" style="cursor:pointer" onclick="irParaLista('status','atencao')" title="Ver crianças em risco ou apertadas"><span>Precisam de você</span><strong>${emRisco + apertado}</strong><small>${emRisco} em risco · ${apertado} apertada${apertado === 1 ? '' : 's'}</small></div>
      <div class="cartao ${corACS30d}" style="cursor:pointer" onclick="irParaLista('status','acs30d')" title="Busca ativa: visita do ACS até 30 dias, ainda dentro do prazo"><span>Visita ACS · 30 dias</span><strong>${pendentes30d.length}</strong><small>${urgentes30d.length ? urgentes30d.length + ' urgente' + (urgentes30d.length===1?'':'s') + ' (≤ 7 dias)' : pendentes30d.length ? 'dentro do prazo' : 'tudo em dia'}</small></div>
      <div class="cartao ${corACS6m}" style="cursor:pointer" onclick="irParaLista('status','acs6m')" title="Busca ativa: visita do ACS aos 6 meses, ainda dentro do prazo"><span>Visita ACS · 6 meses</span><strong>${pendentes6m.length}</strong><small>${urgentes6m.length ? urgentes6m.length + ' urgente' + (urgentes6m.length===1?'':'s') + ' (≤ 7 dias)' : pendentes6m.length ? 'dentro do prazo' : 'tudo em dia'}</small></div>
    </div>

    ${pendentes30d.length ? `
    <div class="bloco">
      <div class="bloco-topo">
        <h2>Visita do ACS até 30 dias — busca ativa</h2>
        <div style="display:flex; align-items:center; gap:.7rem; flex-wrap:wrap">
          <span class="dica">ainda dá tempo · repassar para o ACS</span>

      </div>
      <div class="tabela-wrap"><table>
        <thead><tr><th>Criança</th><th>Idade</th><th>Prazo (30 dias)</th><th>Microárea</th></tr></thead>
        <tbody>${pendentes30d.map(({ c, av }) => {

          return `

    ${pendentes6m.length ? `

        <tbody>${pendentes6m.map(({ c, av }) => {
          const restam = av.por.vis6m.fim6m29d - av.idade;
          return `
          <tr class="linha" onclick="abrirCrianca('${c.id}')">

            <td>${esc(c.microarea || '—')}</td>

      ${(() => {

          return `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1.4rem .8rem">

              <div style="text-align:center; cursor:pointer" onclick="${alvoClique(i.id)}" title="Ver crianças pendentes neste critério">

        </tbody></table></div>`
        : '<p class="dica">Todas as crianças estão com a pontuação cheia.</p>'}
    </div>`;
}

/* ── Lista ─────────────────────────────────────────────────────── */
function telaLista() {
  const ordem = { risco:0, apertado:1, 'no-prazo':2, completa:3, encerrada:4 };
  let linhas = P.criancas.map(c => ({ c, av: avaliar(c) }))
    .sort((x, y) => ordem[x.av.status] - ordem[y.av.status] || x.av.ate2a - y.av.ate2a);
  if (FILTRO_MICRO) linhas = linhas.filter(({ c }) =>
    (String(c.microarea || '').trim() || 'Sem microárea') === FILTRO_MICRO);

  let rotuloFiltro = null;
  if (FILTRO_STATUS === 'atencao') {
    linhas = linhas.filter(({ av }) => av.status === 'risco' || av.status === 'apertado');
    rotuloFiltro = 'Precisam de você (em risco ou apertadas)';
  } else if (FILTRO_STATUS === 'acs30d') {
    linhas = linhas.filter(({ c, av }) => num(c, 'vis30d') === 0 && av.idade <= 30)
      .sort((a, b) => a.av.idade - b.av.idade);
    rotuloFiltro = 'Busca ativa: visita do ACS até 30 dias (ainda dentro do prazo)';
  } else if (FILTRO_STATUS === 'acs6m') {
    linhas = linhas.filter(({ c, av }) =>
        num(c, 'vis6m') === 0 && av.idade >= av.por.vis6m.inicio6m && av.idade <= av.por.vis6m.fim6m29d)
      .sort((a, b) => a.av.idade - b.av.idade);
    rotuloFiltro = 'Busca ativa: visita do ACS aos 6 meses (ainda dentro do prazo)';
  } else if (FILTRO_STATUS === 'prazo') {
    linhas = linhas.filter(({ av }) => av.cumpridos < CRITERIOS.length)
      .sort((a, b) => a.av.ate2a - b.av.ate2a);
    rotuloFiltro = 'Com prazo em aberto, da mais urgente pra menos';
  } else if (FILTRO_CRITERIO) {
    const cr = CRITERIOS.find(c => c.id === FILTRO_CRITERIO);
    linhas = linhas.filter(({ av }) => !av.por[FILTRO_CRITERIO].ok)
      .sort((a, b) => a.av.por[FILTRO_CRITERIO].restam - b.av.por[FILTRO_CRITERIO].restam);
    rotuloFiltro = `Pendente: ${cr ? cr.rotulo : FILTRO_CRITERIO}`;
  } else if (FILTRO_PONTUACAO != null) {
    linhas = linhas.filter(({ av }) => av.cumpridos === FILTRO_PONTUACAO)
      .sort((a, b) => a.av.ate2a - b.av.ate2a);
    rotuloFiltro = `Pontuação ${(FILTRO_PONTUACAO * PESO_CRITERIO).toFixed(2).replace('.', ',')} (${FILTRO_PONTUACAO} de ${CRITERIOS.length} critérios)`;
  }

  const termo = BUSCA.trim().toLowerCase();
  if (termo) linhas = linhas.filter(({ c }) =>
    (c.nome + ' ' + (c.mae || '')).toLowerCase().includes(termo));

  return `
    <div class="bloco">
      <div class="bloco-topo">
        <h2>Crianças</h2>
        <div style="display:flex; align-items:center; gap:.6rem; flex-wrap:wrap">
          <input type="search" id="input-busca" placeholder="Buscar por nome ou mãe" value="${esc(BUSCA)}"
                 style="max-width:260px" oninput="BUSCA=this.value; const _p=this.selectionStart; render(); const _el=document.getElementById('input-busca'); if(_el){ _el.focus(); _el.setSelectionRange(_p,_p); }" />
          <button class="btn-pdf" onclick='exportarPDF(this, ${JSON.stringify("Crianças" + (rotuloFiltro ? " — " + rotuloFiltro : "") + (FILTRO_MICRO ? " — microárea " + FILTRO_MICRO : ""))})'>⇩ PDF</button>
        </div>
      </div>
      ${FILTRO_MICRO ? `
        <div style="display:flex; align-items:center; gap:.5rem; margin:-.6rem 0 1.2rem">
          <span class="chip no-prazo">Microárea ${esc(FILTRO_MICRO)}</span>
          <button class="btn btn-linha" style="padding:.3rem .7rem; font-size:.66rem" onclick="FILTRO_MICRO=null; render()">✕ limpar filtro</button>
        </div>` : ''}
      ${rotuloFiltro ? `
        <div style="display:flex; align-items:center; gap:.5rem; margin:-.6rem 0 1.2rem">
          <span class="chip risco">${esc(rotuloFiltro)}</span>
          <button class="btn btn-linha" style="padding:.3rem .7rem; font-size:.66rem" onclick="FILTRO_STATUS=null; FILTRO_CRITERIO=null; FILTRO_PONTUACAO=null; render()">✕ limpar filtro</button>
        </div>` : ''}
      <div class="tabela-wrap">
        <table>
          <thead><tr>
            <th>Nome</th><th>Idade</th><th>2 anos em</th><th>Critérios</th><th>Pont.</th><th>Situação</th><th>Consultas</th>
          </tr></thead>
          <tbody>
            ${linhas.map(({ c, av }) => `
              <tr class="linha" onclick="abrirCrianca('${c.id}')">
                <td><div><strong>${esc(c.nome)}</strong><br><small style="color:var(--texto-suave)">mãe: ${esc(c.mae || '—')}</small></div></td>
                <td>${idadeTxt(av.idade)}${num(c,'vis30d') === 0 && av.idade <= 30 ? `<br><span class="chip ${(30 - av.idade) <= 7 ? 'risco' : 'apertado'}" style="margin-top:.3rem; display:inline-block">🚪 visita ACS 30d</span>` : ''}${num(c,'vis6m') === 0 && av.idade >= av.por.vis6m.inicio6m && av.idade <= av.por.vis6m.fim6m29d ? `<br><span class="chip ${(av.por.vis6m.fim6m29d - av.idade) <= 7 ? 'risco' : 'apertado'}" style="margin-top:.3rem; display:inline-block">👶 visita ACS 6m</span>` : ''}</td>
                <td>${av.ate2a > 0 ? dias(av.ate2a) : '—'}</td>
                <td><div class="pastilhas">${av.itens.map(i =>
                  `<i class="${i.ok ? 'on' : i.st === 'perdido' ? 'mal' : ''}" title="${esc(i.rotulo)}"></i>`).join('')}</div></td>
                <td class="pontos">${av.pontuacao.toFixed(2).replace('.',',')}</td>
                <td><span class="chip ${av.status}">${ROTULO_STATUS[av.status]}</span></td>
                <td>${av.por.cons2a.feito}/9</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${linhas.length ? '' : '<p class="dica" style="margin-top:1rem">Nenhuma criança encontrada.</p>'}
    </div>`;
}

/* ── Microáreas ────────────────────────────────────────────────── */
function telaMicro() {
  const avs = P.criancas.map(c => ({ c, av: avaliar(c) }));
  const grupos = {};
  avs.forEach(x => {
    const m = String(x.c.microarea || '').trim() || 'Sem microárea';
    (grupos[m] = grupos[m] || []).push(x);
  });

  const linhas = Object.entries(grupos).map(([nome, itens]) => {
    const n = itens.length;
    const indicadores = CRITERIOS.map(cr => {
      const feito = itens.filter(x => x.av.por[cr.id].ok).length;
      return { ...cr, valor: pct(feito, n) };
    });
    const geral = Math.round(indicadores.reduce((s, i) => s + i.valor, 0) / CRITERIOS.length);
    const media = itens.reduce((s, x) => s + x.av.pontuacao, 0) / n;
    const risco = itens.filter(x => x.av.status === 'risco').length;
    const apertado = itens.filter(x => x.av.status === 'apertado').length;
    return { nome, n, indicadores, geral, media, risco, apertado };
  }).sort((a, b) => b.geral - a.geral || b.n - a.n);

  if (!linhas.length) {
    return `<div class="bloco"><p class="dica">Nenhuma criança cadastrada ainda — importe o CSV do e-SUS para ver o comparativo por microárea.</p></div>`;
  }

  const melhor = linhas[0];
  const pior = linhas[linhas.length - 1];
  const mediaGeral = Math.round(linhas.reduce((s, l) => s + l.geral, 0) / linhas.length);

  const rotuloCurto = r => r
    .replace('Visita domiciliar até 30 dias', 'Visita 30d')
    .replace('Visita domiciliar aos 6 meses', 'Visita 6m')
    .replace('1ª consulta até 30 dias de vida', '1ª consulta')
    .replace('9 consultas até 2 anos', '9 consultas')
    .replace('9 consultas com peso e altura', 'Peso/altura')
    .replace('Vacinas do calendário em dia', 'Vacinas');

  return `
    <div class="cartoes">
      <div class="cartao"><span>Microáreas</span><strong>${linhas.length}</strong><small>com crianças em acompanhamento</small></div>
      <div class="cartao cor-verde"><span>Mais atualizada</span><strong style="font-size:1.35rem; line-height:1.25">${esc(melhor.nome)}</strong><small>${melhor.geral}% em dia · ${melhor.n} criança${melhor.n===1?'':'s'}</small></div>
      <div class="cartao cor-erro"><span>Precisa de atenção</span><strong style="font-size:1.35rem; line-height:1.25">${esc(pior.nome)}</strong><small>${pior.geral}% em dia · ${pior.risco} em risco</small></div>
      <div class="cartao cor-ocre"><span>Média geral</span><strong>${mediaGeral}%</strong><small>entre todas as microáreas</small></div>
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Ranking por microárea</h2>
        <div style="display:flex; align-items:center; gap:.9rem; flex-wrap:wrap">
          ${alternador('micro', [{ id:'barras', rotulo:'Barras' }, { id:'rosca', rotulo:'Rosca' }, { id:'pizza', rotulo:'Pizza' }])}
          <button class="btn-pdf" onclick="exportarPDF(this, 'Ranking por microárea')">⇩ PDF</button>
          <span class="dica">média dos ${CRITERIOS.length} critérios · melhor no topo</span>
        </div>
      </div>
      ${GRAFICO.micro === 'rosca' ? `
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1.4rem .8rem">
          ${linhas.map((l, i) => `
            <div style="text-align:center; cursor:pointer" title="Ver crianças desta microárea"
              onclick='irParaLista("micro", ${JSON.stringify(l.nome)})'>
              ${svgRosca(l.geral, corPct(l.geral))}
              <div style="font-size:.9rem; margin-top:.5rem"><strong>#${i + 1}</strong> · ${esc(l.nome)}</div>
              <small class="dica">${l.n} criança${l.n === 1 ? '' : 's'}${l.risco ? ` · ${l.risco} em risco` : ''}</small>
            </div>`).join('')}
        </div>`
      : GRAFICO.micro === 'pizza' ? (() => {
          // Aqui a pizza mostra como as crianças se distribuem entre as microáreas
          // (isso sim é parte de um todo); a cor de cada fatia é o desempenho dela.
          const fatias = linhas.map(l => ({
            rotulo: `${l.nome} — ${l.geral}% em dia`,
            valor: l.n,
            cor: corPct(l.geral)
          }));
          return `<div style="display:flex; gap:2rem; align-items:center; justify-content:center; flex-wrap:wrap">
              ${svgPizza(fatias)}
              ${legendaPizza(fatias)}
            </div>
            <p class="dica" style="margin-top:1rem; text-align:center">
              O tamanho da fatia é quantas crianças a microárea tem; a cor é o quanto ela está em dia.
            </p>`;
        })()
      : linhas.map((l, i) => `
        <div class="barra-lin linha" style="cursor:pointer" onclick='irParaLista("micro", ${JSON.stringify(l.nome)})' title="Ver crianças desta microárea">
          <div>
            <div style="display:flex; align-items:baseline; gap:.55rem; margin-bottom:.45rem; flex-wrap:wrap">
              <span style="font-family:'Fraunces',serif; font-size:.95rem; color:var(--texto-suave)">#${i + 1}</span>
              <strong style="font-size:.95rem">${esc(l.nome)}</strong>
              <span class="dica">${l.n} criança${l.n === 1 ? '' : 's'}${l.risco ? ` · ${l.risco} em risco` : ''}</span>
            </div>
            <div class="trilho" style="height:9px"><i style="width:${l.geral}%; background:${corPct(l.geral)}"></i></div>
          </div>
          <div style="text-align:right; min-width:100px">
            <strong style="font-family:'Fraunces',serif; font-size:1.35rem; color:${corPct(l.geral)}">${l.geral}%</strong>
            <small style="display:block; font-size:.72rem; color:var(--texto-suave)">pont. média ${l.media.toFixed(2).replace('.', ',')}</small>
          </div>
        </div>`).join('')}
      ${GRAFICO.micro === 'pizza' ? '' : '<p class="dica" style="margin-top:1rem">Clique numa microárea para ver as crianças dela.</p>'}
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Mapa de critérios</h2>
        <div style="display:flex; align-items:center; gap:.7rem; flex-wrap:wrap">
          <span class="dica">% por critério, em cada microárea</span>
          <button class="btn-pdf" onclick="exportarPDF(this, 'Mapa de critérios por microárea')">⇩ PDF</button>
        </div>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead><tr>
            <th>Microárea</th><th>Crianças</th>
            ${CRITERIOS.map(c => `<th${(c.id === 'vis30d' || c.id === 'vis6m') ? ' title="Registrado pelo agente comunitário de saúde (ACS)"' : ''}>${esc(rotuloCurto(c.rotulo))}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${linhas.map(l => `
              <tr class="linha" style="cursor:pointer" onclick='irParaLista("micro", ${JSON.stringify(l.nome)})' title="Ver crianças desta microárea">
                <td><strong>${esc(l.nome)}</strong></td>
                <td>${l.n}</td>
                ${l.indicadores.map(i => `
                  <td>
                    <div style="display:inline-flex; align-items:center; justify-content:center; min-width:52px; height:28px; padding:0 .4rem; border-radius:4px; font-size:.76rem; font-weight:700; color:#fff; background:${corPct(i.valor)}">
                      ${i.valor}%
                    </div>
                  </td>`).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="dica" style="margin-top:1rem">Verde = maioria em dia · ocre = atenção · vermelho = a maior parte pendente nesse critério.</p>
    </div>`;
}

function abrirCrianca(id) { SEL = id; VIEW = 'crianca'; render(); window.scrollTo(0, 0); }

/* ── Checklist da criança ──────────────────────────────────────── */
function linhaContador(id, campo, rotulo, detalhe, valor, st, nota) {
  return `
    <div class="check-item ${st}">
      <span class="marca-ok">${st === 'ok' ? '✓' : st === 'perdido' ? '✕' : ''}</span>
      <div class="check-txt">
        <strong>${esc(rotulo)}</strong>
        <small>${esc(detalhe ? detalhe + ' · ' : '')}${esc(nota)}</small>
      </div>
      <div class="contador">
        <button onclick="event.stopPropagation(); mudar('${id}','${campo}',-1)" ${valor <= 0 ? 'disabled' : ''} aria-label="Tirar um">−</button>
        <b>${valor}</b>
        <button onclick="event.stopPropagation(); mudar('${id}','${campo}',1)" aria-label="Somar um">+</button>
      </div>
    </div>`;
}

function telaCrianca() {
  const c = P.criancas.find(x => x.id === SEL);
  if (!c) { VIEW = 'lista'; return telaLista(); }
  const av = avaliar(c);
  const vac = c.vacinas || {};

  return `
    <button class="btn btn-linha" style="margin-bottom:1.2rem" onclick="VIEW='lista'; render()">← Todas as crianças</button>

    <div class="bloco">
      <div class="bloco-topo">
        <div>
          <h2 style="margin-bottom:.2rem">${esc(c.nome)}</h2>

            ${c.telefone ? ' · ' + esc(c.telefone) : ''}${c.microarea ? ' · <a href="#" onclick=\'event.preventDefault(); irParaLista("micro", ' + JSON.stringify(String(c.microarea).trim()) + ')\' style="color:var(--verde-600)">microárea ' + esc(c.microarea) + '</a>' : ''}</span>
        </div>
        <div style="display:flex; gap:.6rem; align-items:center">
          <span class="chip ${av.status}">${ROTULO_STATUS[av.status]}</span>
          <button class="btn btn-linha" onclick="EDITANDO='${c.id}'; VIEW='form'; render()">Editar</button>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1.4rem">
        <div>
          <span class="dica">Pontuação</span>
          <div style="font-family:'Fraunces',serif; font-size:2.4rem; line-height:1.1; color:${corPct(pct(av.cumpridos, CRITERIOS.length))}">
            ${av.pontuacao.toFixed(2).replace('.',',')}
          </div>
          <span class="dica">${av.cumpridos} de ${CRITERIOS.length} critérios</span>
        </div>
        <div>
          <span class="dica">Completa 2 anos em</span>
          <div style="font-family:'Fraunces',serif; font-size:2.4rem; line-height:1.1; color:${av.ate2a <= 0 ? 'var(--erro)' : av.ate2a < 90 ? 'var(--ocre)' : 'var(--verde-600)'}">
            ${av.ate2a > 0 ? av.ate2a : '0'}
          </div>
          <span class="dica">${av.ate2a > 0 ? 'dias de prazo' : 'prazo encerrado'}</span>
        </div>
        <div>
          <span class="dica">Próximo passo</span>
          <p style="margin:.35rem 0 0; font-size:.9rem">${esc(proximoPasso(av))}</p>
        </div>
      </div>
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Checklist até os 2 anos</h2>
        <span class="dica">clique em + a cada atendimento</span>
      </div>

      ${linhaContador(c.id, 'vis30d', 'Visita domiciliar até 30 dias',
        'agente comunitário (ACS)', num(c,'vis30d'), av.por.vis30d.st, av.por.vis30d.nota)}

      ${linhaContador(c.id, 'vis6m', 'Visita domiciliar aos 6 meses',
        'agente comunitário (ACS)', num(c,'vis6m'), av.por.vis6m.st, av.por.vis6m.nota)}

      ${linhaContador(c.id, 'cons30d', '1ª consulta até 30 dias de vida',
        null, num(c,'cons30d'), av.por.cons30d.st, av.por.cons30d.nota)}

      ${linhaContador(c.id, 'cons2a', 'Consultas de puericultura',
        `${num(c,'cons2a')} de 9`, num(c,'cons2a'), av.por.cons2a.st, av.por.cons2a.nota)}

      ${linhaContador(c.id, 'pesalt2a', 'Medições de peso e altura',
        `${num(c,'pesalt2a')} de 9`, num(c,'pesalt2a'), av.por.pesalt2a.st, av.por.pesalt2a.nota)}

      <div class="check-item ${itVac.st}" style="grid-template-columns:auto 1fr">
        <span class="marca-ok">${itVac.ok ? '✓' : itVac.st === 'perdido' ? '✕' : ''}</span>
        <div class="check-txt">
          <strong>Vacinas do calendário</strong>
          <small>${esc(itVac.nota)}</small>
          <div class="vac-linha" style="margin-top:.7rem">
            ${VACINAS.map(v => `
              <button class="vac-chip ${vac[v.id] ? 'on' : ''}" onclick="alternarVacina('${c.id}','${v.id}')">
                ${vac[v.id] ? '✓ ' : ''}${esc(v.rotulo)}
              </button>`).join('')}
          </div>

      </div>

      <p class="dica" style="margin-top:1rem">

      </p>
    </div>

    <button class="btn btn-remover" onclick="excluirCrianca('${c.id}')">Excluir criança</button>`;
}

async function mudar(id, campo, delta) {
  const c = P.criancas.find(x => x.id === id);
  c[campo] = Math.max(0, num(c, campo) + delta);
  render();
  await salvar();
}

async function alternarVacina(id, vid) {
  const c = P.criancas.find(x => x.id === id);
  c.vacinas = c.vacinas || {};
  c.vacinas[vid] = !c.vacinas[vid];
  render();
  await salvar();
}

async function excluirCrianca(id) {
  const c = P.criancas.find(x => x.id === id);
  if (!confirm(`Excluir ${c.nome}?`)) return;
  P.criancas = P.criancas.filter(x => x.id !== id);
  SEL = null; VIEW = 'lista';
  await salvar();
  render();
}

async function salvarCrianca() {
  const nome = document.getElementById('f-nome').value.trim();
  const nasc = document.getElementById('f-nasc').value;
  if (!nome || !nasc) return toast('Nome e nascimento são obrigatórios.', true);
  const dados = {
    nome, nascimento: nasc,
    sexo: document.getElementById('f-sexo').value,
    mae: document.getElementById('f-mae').value.trim(),
    telefone: document.getElementById('f-tel').value.trim(),
    microarea: document.getElementById('f-micro').value.trim(),
    obs: document.getElementById('f-obs').value.trim()
  };
  if (EDITANDO) {
    Object.assign(P.criancas.find(x => x.id === EDITANDO), dados);
    SEL = EDITANDO; EDITANDO = null; VIEW = 'crianca';
  } else {
    const nova = { id:'c' + Date.now(), ...dados,
      vis30d:0, vis6m:0, cons30d:0, cons2a:0, pesalt2a:0,
      vacinas:{ pneumo10v:false, penta:false, vip:false, scr:false } };
    P.criancas.push(nova);
    SEL = nova.id; VIEW = 'crianca';
  }
  await salvar();
  render();
  toast('Salvo.');
}

/* ── Exportar tabela para PDF ──────────────────────────────────────
   Monta um documento limpo numa janela nova e chama a impressão do
   navegador — de onde dá pra salvar em PDF. Sem biblioteca externa:
   funciona offline e não manda dado de paciente para lugar nenhum. */
function exportarPDF(btn, titulo) {
  const bloco = btn.closest('.bloco');
  if (!bloco) return toast('Nada para exportar aqui.', true);

  // Tabela vira paisagem (muitas colunas); gráfico vira retrato.
  const tabela = bloco.querySelector('table');
  const origem = tabela || bloco;
  const copia = origem.cloneNode(true);

  // Tira o que só faz sentido na tela: botões, alternadores, campo de busca.
  copia.querySelectorAll('button, input, .btn-pdf').forEach(el => el.remove());
  copia.querySelectorAll('[onclick]').forEach(el => el.removeAttribute('onclick'));
  copia.querySelectorAll('[style*="cursor"]').forEach(el => el.style.cursor = '');
  if (!tabela) {
    // No bloco inteiro, o cabeçalho já é reimpresso pelo <h1> do documento.
    const topo = copia.querySelector('.bloco-topo');
    if (topo) topo.remove();
  }

  const agora = new Date();
  const carimbo = agora.toLocaleDateString('pt-BR') + ' às ' +
    agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const linhas = copia.querySelectorAll('tbody tr').length;

  const doc = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8" />
<title>${esc(titulo)} — ${carimbo}</title>
<style>
  @page { size:A4 ${tabela ? 'landscape' : 'portrait'}; margin:14mm; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#17251F; margin:0; font-size:10pt; }
  header { border-bottom:2px solid #12352A; padding-bottom:8px; margin-bottom:14px; }
  .marca { font-size:15pt; font-weight:700; color:#12352A; }
  .sub { font-size:8pt; letter-spacing:.14em; text-transform:uppercase; color:#B87F6C; margin-top:2px; }
  h1 { font-size:13pt; margin:14px 0 3px; }
  .meta { font-size:8.5pt; color:#5D6E66; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:9pt; }
  th { text-align:left; font-size:7.5pt; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
       color:#5D6E66; padding:6px 7px; border-bottom:1.5px solid #12352A; }
  td { padding:6px 7px; border-bottom:1px solid #E3D8C6; vertical-align:middle; }
  tr { break-inside:avoid; page-break-inside:avoid; }
  tbody tr:nth-child(even) { background:#FAF7F1; }
  .chip { font-size:7.5pt; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
          padding:2px 7px; border-radius:20px; white-space:nowrap; display:inline-block; }
  .chip.completa { background:#15803D; color:#fff; }
  .chip.no-prazo { background:#DCE9E1; color:#15803D; }
  .chip.apertado { background:#FEF3C7; color:#CA8A04; }
  .chip.risco { background:#FEE2E2; color:#DC2626; }
  .chip.encerrada { background:#EFE7DA; color:#5D6E66; }
  .pastilhas { display:flex; gap:3px; }
  .pastilhas i { width:14px; height:7px; border-radius:2px; background:#EFE7DA; display:inline-block; }
  .pastilhas i.on { background:#15803D; }
  .pastilhas i.mal { background:#DC2626; }
  .pontos { font-size:11pt; font-weight:600; }
  small { color:#5D6E66; font-size:7.5pt; }
  /* gráficos: barras, roscas e pizza */
  .trilho { background:#EFE7DA; border-radius:20px; overflow:hidden; }
  .trilho i { display:block; height:100%; border-radius:20px; }
  .barra-lin { display:grid; grid-template-columns:1fr auto; gap:.3rem 1rem; align-items:center;
               padding:7px 0; border-bottom:1px solid #EFE7DA; break-inside:avoid; }
  .barra-lin:last-child { border-bottom:0; }
  .dica { font-size:8pt; color:#5D6E66; }
  svg { max-width:100%; height:auto; }
  footer { margin-top:16px; padding-top:7px; border-top:1px solid #E3D8C6;
           font-size:7.5pt; color:#5D6E66; }
  footer strong { color:#DC2626; }
</style></head><body>
<header>
  <div class="marca">Puericultura — Josiane Tavares</div>
  <div class="sub">Enfermeira · COREN-RJ 455892-ENF · ESF Granja · Paty do Alferes/RJ</div>
</header>
<h1>${esc(titulo)}</h1>
<div class="meta">${tabela ? `${linhas} registro${linhas === 1 ? '' : 's'} · ` : `${P.criancas.length} crianças no acompanhamento · `}gerado em ${carimbo}</div>
${copia.outerHTML}
<footer><strong>Documento com dados pessoais de saúde (LGPD).</strong>
Uso restrito à equipe. Não compartilhe nem descarte sem cuidado.</footer>
</body></html>`;

  const janela = window.open('', '_blank');
  if (!janela) return toast('Libere as janelas pop-up para exportar.', true);
  janela.document.write(doc);
  janela.document.close();
  janela.focus();
  // Dá um instante para a fonte/layout assentarem antes de abrir a impressão.
  setTimeout(() => janela.print(), 350);
}

async function importarCSV(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('csv', file);
  toast('Importando planilha…');
  try {
    const r = await fetch('/api/admin/pacientes/importar', { method:'POST', body: fd });
    const j = await r.json();
    if (r.ok && j.ok) {
      toast(`Importado: ${j.novos} nova${j.novos===1?'':'s'} · ${j.atualizados} atualizada${j.atualizados===1?'':'s'} · ${j.total} no total.`);
      await carregar();
    } else {
      toast(j.erro || 'Erro ao importar CSV.', true);
    }
  } catch (e) {
    toast('Erro ao enviar o arquivo.', true);
  }
  document.getElementById('input-csv').value = '';
}

// sessão ativa entra direto
fetch('/api/sessao').then(r => r.json()).then(j => { if (j.autenticado) carregar(); });
</script>
