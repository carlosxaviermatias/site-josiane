<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Puericultura — Josiane Tavares</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde-900:#0B1F17; --verde-800:#12352A; --verde-600:#1E5340; --verde-400:#4A8570;
    --areia:#F7F3EC; --areia-2:#EFE7DA; --areia-3:#E3D8C6;
    --rose:#B87F6C; --texto:#17251F; --texto-suave:#5D6E66;
    --ocre:#9A6F23; --ocre-bg:#F4E8CD;
    --erro:#A34A31; --erro-bg:#F3DFD7;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',sans-serif; font-size:15px; background:var(--areia); color:var(--texto); }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; font-weight:400; margin:0 0 .5em; }

  /* login */
  #login { min-height:100vh; display:grid; place-items:center; padding:2rem; background:var(--verde-800); }
  .login-card { width:min(400px,100%); background:var(--areia); padding:3rem 2.5rem; border-radius:4px; }
  .login-card h1 { font-size:1.7rem; color:var(--verde-800); }
  .login-card p { color:var(--texto-suave); font-size:.9rem; margin:0 0 2rem; }

  /* app */
  #app { display:none; min-height:100vh; }
  #app.ativo { display:block; }
  .topo {
    background:var(--verde-900); color:var(--areia);
    padding:1.1rem clamp(1.2rem,4vw,2.5rem);
    display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  }
  .topo .marca strong { font-family:'Fraunces',serif; font-weight:400; font-size:1.25rem; display:block; }
  .topo .marca span { font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--rose); }
  .topo nav { display:flex; gap:1.4rem; align-items:center; font-size:.85rem; }
  .topo nav a { color:rgba(247,243,236,.65); text-decoration:none; }
  .topo nav a:hover { color:var(--areia); }

  .abas-pill { display:flex; gap:.5rem; flex-wrap:wrap; padding:1.4rem clamp(1.2rem,4vw,2.5rem) 0; }
  .abas-pill button {
    font:inherit; font-size:.82rem; font-weight:600;
    padding:.55rem 1.15rem; border-radius:100px; cursor:pointer;
    background:transparent; border:1px solid var(--areia-3); color:var(--texto-suave);
    transition:180ms;
  }
  .abas-pill button:hover { border-color:var(--verde-400); color:var(--verde-600); }
  .abas-pill button.ativa { background:var(--verde-800); border-color:var(--verde-800); color:var(--areia); }
  .abas-pill .badge {
    display:inline-grid; place-content:center; min-width:19px; height:19px;
    border-radius:100px; background:var(--rose); color:#fff;
    font-size:.68rem; margin-left:.45rem; padding:0 .3rem;
  }

  main { padding:1.6rem clamp(1.2rem,4vw,2.5rem) 5rem; max-width:1080px; }

  /* cards e blocos */
  .cartoes { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--areia-3); border:1px solid var(--areia-3); border-radius:4px; overflow:hidden; margin-bottom:1.5rem; }
  .cartao { background:#fff; padding:1.2rem 1.3rem; }
  .cartao span { display:block; font-size:.64rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--texto-suave); margin-bottom:.4rem; }
  .cartao strong { font-family:'Fraunces',serif; font-weight:400; font-size:1.9rem; }
  .cartao small { display:block; font-size:.75rem; color:var(--texto-suave); }
  .cor-verde strong { color:var(--verde-600); }
  .cor-ocre strong { color:var(--ocre); }
  .cor-erro strong { color:var(--erro); }
  .cor-claro strong { color:var(--verde-400); }

  .bloco { background:#fff; border:1px solid var(--areia-3); border-radius:4px; padding:1.6rem; margin-bottom:1.3rem; }
  .bloco-topo { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .bloco-topo h2 { font-size:1.3rem; margin:0; }
  .dica { font-size:.78rem; color:var(--texto-suave); }

  .visao-grid { display:grid; grid-template-columns:auto 1fr; gap:2rem; align-items:center; }
  @media (max-width:720px){ .visao-grid { grid-template-columns:1fr; } }
  .legenda { display:flex; flex-direction:column; gap:.55rem; font-size:.86rem; }
  .legenda i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:.55rem; }

  /* avisos */
  .aviso-item {
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    padding:.85rem 1rem; border-radius:4px; margin-bottom:.55rem;
    border:1px solid var(--areia-3); background:var(--areia); cursor:pointer;
    transition:160ms;
  }
  .aviso-item:hover { border-color:var(--verde-400); }
  .aviso-item.atraso { background:var(--erro-bg); border-color:#E0BBAC; }
  .aviso-item.vence { background:var(--ocre-bg); border-color:#E3CD9C; }
  .aviso-item strong { font-size:.92rem; }
  .aviso-item span { font-size:.86rem; color:var(--texto-suave); flex:1; }
  .aviso-etq {
    font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:.25rem .6rem; border-radius:100px; white-space:nowrap;
  }
  .aviso-item.atraso .aviso-etq { background:var(--erro); color:#fff; }
  .aviso-item.vence  .aviso-etq { background:var(--ocre); color:#fff; }

  /* chips de situação */
  .chip { font-size:.68rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:.28rem .65rem; border-radius:100px; white-space:nowrap; }
  .chip.em-dia    { background:#DCE9E1; color:var(--verde-600); }
  .chip.atencao   { background:var(--ocre-bg); color:var(--ocre); }
  .chip.atrasado  { background:var(--erro-bg); color:var(--erro); }
  .chip.completo  { background:var(--verde-600); color:#fff; }
  .chip.encerrado { background:var(--areia-2); color:var(--texto-suave); }

  /* tabela */
  .tabela-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th { text-align:left; font-size:.66rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--texto-suave); padding:.6rem .8rem; border-bottom:1px solid var(--areia-3); }
  td { padding:.85rem .8rem; border-bottom:1px solid var(--areia-2); vertical-align:middle; }
  tr.linha { cursor:pointer; transition:120ms; }
  tr.linha:hover { background:var(--areia); }
  .mini-prog { display:flex; align-items:center; gap:.6rem; min-width:130px; }
  .mini-prog .trilho { flex:1; height:5px; background:var(--areia-2); border-radius:100px; overflow:hidden; }
  .mini-prog .trilho i { display:block; height:100%; background:var(--verde-400); border-radius:100px; }
  .mini-prog small { font-size:.74rem; color:var(--texto-suave); white-space:nowrap; }

  /* formulários */
  .campo { margin-bottom:1.1rem; }
  .campo label { display:block; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-suave); margin-bottom:.4rem; }
  input, select, textarea {
    width:100%; padding:.68rem .85rem; font:inherit; font-size:.92rem;
    background:#fff; border:1px solid var(--areia-3); border-radius:3px; color:var(--texto);
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--verde-400); box-shadow:0 0 0 3px rgba(74,133,112,.14); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 1.2rem; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 1.2rem; }
  @media (max-width:640px){ .grid2,.grid3 { grid-template-columns:1fr; } }

  button.btn {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.68rem 1.35rem; font:inherit; font-size:.74rem; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase;
    border:1px solid transparent; border-radius:3px; cursor:pointer; transition:160ms;
  }
  .btn-verde { background:var(--verde-800); color:var(--areia); }
  .btn-verde:hover { background:var(--verde-600); }
  .btn-linha { background:transparent; border-color:var(--areia-3); color:var(--texto-suave); }
  .btn-linha:hover { border-color:var(--verde-600); color:var(--verde-600); }
  .btn-remover { background:transparent; border-color:#E0BBAC; color:var(--erro); padding:.4rem .8rem; font-size:.66rem; }
  .btn-remover:hover { background:var(--erro-bg); }

  /* linha do tempo da criança */
  .passos { display:grid; grid-template-columns:repeat(9,minmax(88px,1fr)); overflow-x:auto; padding:1rem 0 .4rem; }
  .passo { position:relative; text-align:center; padding:0 .3rem; }
  .passo::before { content:''; position:absolute; top:15px; left:-50%; width:100%; height:2px; background:var(--areia-3); }
  .passo:first-child::before { display:none; }
  .p-dot {
    position:relative; z-index:1;
    display:inline-grid; place-content:center;
    width:32px; height:32px; border-radius:50%;
    background:#fff; border:2px solid var(--areia-3);
    font-size:.8rem; font-weight:700;
  }
  .passo.feito .p-dot   { background:var(--verde-600); border-color:var(--verde-600); color:#fff; }
  .passo.aberto .p-dot  { background:var(--ocre-bg); border-color:var(--ocre); color:var(--ocre); }
  .passo.perdido .p-dot { background:var(--erro-bg); border-color:#D3A18E; color:var(--erro); }
  .passo strong { display:block; font-size:.72rem; font-weight:600; margin-top:.5rem; }
  .passo small { display:block; font-size:.66rem; color:var(--texto-suave); margin-top:.1rem; }

  .badge30 { display:inline-flex; align-items:center; gap:.5rem; font-size:.8rem; padding:.5rem .9rem; border-radius:4px; margin:.25rem .5rem .25rem 0; border:1px solid var(--areia-3); background:var(--areia); }
  .badge30.ok      { border-color:#BFD4C7; background:#E7F0EA; color:var(--verde-600); }
  .badge30.pend    { border-color:#E3CD9C; background:var(--ocre-bg); color:var(--ocre); }
  .badge30.falhou  { border-color:#E0BBAC; background:var(--erro-bg); color:var(--erro); }

  #aviso-toast {
    position:fixed; right:1.5rem; bottom:1.5rem; z-index:50;
    padding:.9rem 1.4rem; border-radius:3px; font-size:.88rem; font-weight:500;
    background:var(--verde-800); color:var(--areia);
    box-shadow:0 12px 30px rgba(11,31,23,.25);
    opacity:0; transform:translateY(12px); pointer-events:none; transition:220ms;
  }
  #aviso-toast.visivel { opacity:1; transform:translateY(0); }
  #aviso-toast.erro { background:var(--erro); }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" onsubmit="entrar(event)">
    <h1>Puericultura</h1>
    <p>Acompanhamento de crianças até 2 anos. Área restrita.</p>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required />
    </div>
    <button class="btn btn-verde" style="width:100%; justify-content:center" type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <div class="topo">
    <div class="marca">
      <strong>Puericultura</strong>
      <span>Josiane Tavares · Enfermeira</span>
    </div>
    <nav>
      <a href="/admin">Painel do site</a>
      <a href="/" target="_blank">Ver o site</a>
      <a href="#" onclick="sair(); return false" style="color:var(--rose)">Sair</a>
    </nav>
  </div>
  <div class="abas-pill" id="abas"></div>
  <main id="conteudo"></main>
</div>

<div id="aviso-toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Motor de acompanhamento — puericultura
   Espelha as 5 práticas do painel de indicadores da APS:
     1ª consulta <30d · 9 puericulturas · 9 antropometrias
     visita ACS <30d e aos 6m · vacinas
   Cada marco tem janela [ini,fim] em dias de vida.
   ════════════════════════════════════════════════════════════════ */

const MARCOS = [
  { id:'sem1', rotulo:'1ª semana', alvoDias:7,   ini:0,   fim:30  },
  { id:'m1',   rotulo:'1 mês',     alvoDias:30,  ini:16,  fim:75  },
  { id:'m2',   rotulo:'2 meses',   alvoDias:61,  ini:46,  fim:107 },
  { id:'m4',   rotulo:'4 meses',   alvoDias:122, ini:107, fim:168 },
  { id:'m6',   rotulo:'6 meses',   alvoDias:183, ini:168, fim:244 },
  { id:'m9',   rotulo:'9 meses',   alvoDias:274, ini:244, fim:335 },
  { id:'m12',  rotulo:'12 meses',  alvoDias:365, ini:335, fim:470 },
  { id:'m18',  rotulo:'18 meses',  alvoDias:548, ini:470, fim:650 },
  { id:'m24',  rotulo:'24 meses',  alvoDias:730, ini:650, fim:800 }
];
const LIMITE_ACOMP = 800;
const VISITA_6M = { ini: 150, fim: 240 };   // janela da visita do ACS aos 6 meses
const TIPOS = { enfermeiro:'Enfermeiro', medico:'Médico', acs:'ACS (visita domiciliar)' };

const PRATICAS = [
  { id:'consulta30',  rotulo:'1ª consulta antes de 30 dias' },
  { id:'puericult9',  rotulo:'9 puericulturas' },
  { id:'antropo9',    rotulo:'9 avaliações antropométricas' },
  { id:'visitas',     rotulo:'Visita antes de 30 dias e 6 meses' },
  { id:'vacinas',     rotulo:'Vacinas' }
];

let P = null, VIEW = 'visao', SEL = null, EDITANDO = null, BUSCA = '';

const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataISO = d => d.toISOString().slice(0,10);
const fmt = iso => { const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; };
const pct = (n, d) => d ? Math.round(n / d * 100) : null;

function diasDeVida(nasc, ref = HOJE) {
  return Math.round((ref - new Date(nasc + 'T00:00:00')) / 86400000);
}

function idadeTxt(dias) {
  if (dias < 0) return '—';
  if (dias < 60) return dias + (dias === 1 ? ' dia' : ' dias');
  const m = Math.floor(dias / 30.44);
  if (m < 24) return m + ' meses';
  const a = Math.floor(m / 12), r = m % 12;
  return a + (a > 1 ? ' anos' : ' ano') + (r ? ` e ${r} m` : '');
}

const temAntropo = a => a.peso != null && a.peso !== '' && a.altura != null && a.altura !== '';

function avaliar(c) {
  const idade = diasDeVida(c.nascimento);
  const todos = (c.atendimentos || [])
    .map((a, ix) => ({ ...a, ix, dias: diasDeVida(c.nascimento, new Date(a.data + 'T00:00:00')) }))
    .sort((x, y) => x.dias - y.dias);
  const consultas = todos.filter(a => a.tipo !== 'acs');
  const visitasACS = todos.filter(a => a.tipo === 'acs');

  // ── 9 puericulturas + 9 antropometrias ──
  const usadas = new Set();
  const marcos = MARCOS.map(m => {
    let st = 'futuro', feito = null;
    const i = consultas.findIndex((k, ix) => !usadas.has(ix) && k.dias >= m.ini && k.dias <= m.fim);
    if (i >= 0) { usadas.add(i); st = 'feito'; feito = consultas[i]; }
    else if (idade > m.fim) st = 'perdido';
    else if (idade >= m.ini) st = 'aberto';
    return { ...m, st, feito, comAntropo: !!(feito && temAntropo(feito)),
             vence: m.fim - idade, atraso: idade - m.fim };
  });
  const feitos    = marcos.filter(m => m.st === 'feito').length;
  const antropos  = marcos.filter(m => m.comAntropo).length;
  const esperados = MARCOS.filter(m => m.alvoDias <= idade).length;

  // ── 1ª consulta em até 30 dias ──
  const primCons = consultas[0] || null;
  const consulta30 = primCons
    ? { st: primCons.dias <= 30 ? 'ok' : 'falhou', dias: primCons.dias }
    : { st: idade > 30 ? 'falhou' : 'pend', vence: 30 - idade };

  // ── visitas do ACS: até 30 dias e por volta dos 6 meses ──
  const v30 = visitasACS.find(v => v.dias <= 30);
  const visita30 = v30
    ? { st:'ok', dias: v30.dias }
    : { st: idade > 30 ? 'falhou' : 'pend', vence: 30 - idade };
  const v6 = visitasACS.find(v => v.dias >= VISITA_6M.ini && v.dias <= VISITA_6M.fim);
  const visita6m = v6
    ? { st:'ok', dias: v6.dias }
    : idade > VISITA_6M.fim ? { st:'falhou' }
    : idade >= VISITA_6M.ini ? { st:'aberto', vence: VISITA_6M.fim - idade }
    : { st:'futuro', abre: VISITA_6M.ini - idade };

  // ── vacinas ──
  const vac = (c.vacinas && c.vacinas.situacao) || 'nao-verificado';

  // ── contribuição de cada prática (feito / devido) ──
  const praticas = {
    consulta30: idade > 30 ? { feito: consulta30.st === 'ok' ? 1 : 0, devido: 1 } : { feito: 0, devido: 0 },
    puericult9: { feito: feitos,   devido: esperados },
    antropo9:   { feito: antropos, devido: esperados },
    visitas: {
      feito: (visita30.st === 'ok' ? 1 : 0) + (visita6m.st === 'ok' ? 1 : 0),
      devido: (idade > 30 ? 1 : 0) + (idade > VISITA_6M.fim ? 1 : 0)
    },
    vacinas: vac === 'nao-verificado' ? { feito: 0, devido: 0 } : { feito: vac === 'em-dia' ? 1 : 0, devido: 1 }
  };

  // ── avisos acionáveis ──
  const avisos = [];
  if (idade <= LIMITE_ACOMP) {
    if (consulta30.st === 'pend' && !primCons)
      avisos.push({ tipo:'vence', dias: consulta30.vence, texto:'1ª consulta (até 30 dias de vida)' });
    if (consulta30.st === 'falhou' && !primCons)
      avisos.push({ tipo:'atraso', dias: idade - 30, texto:'1ª consulta não realizada até 30 dias' });

    if (visita30.st === 'pend')
      avisos.push({ tipo:'vence', dias: visita30.vence, texto:'Visita do ACS (até 30 dias)' });
    if (visita30.st === 'falhou')
      avisos.push({ tipo:'atraso', dias: idade - 30, texto:'Visita do ACS de 30 dias não realizada' });
    if (visita6m.st === 'aberto')
      avisos.push({ tipo:'vence', dias: visita6m.vence, texto:'Visita do ACS de 6 meses' });
    if (visita6m.st === 'falhou' && !visitasACS.some(v => v.dias > VISITA_6M.fim))
      avisos.push({ tipo:'atraso', dias: idade - VISITA_6M.fim, texto:'Visita do ACS de 6 meses não realizada' });

    if (vac === 'atraso')
      avisos.push({ tipo:'atraso', dias: 0, texto:'Vacinas em atraso' });
    if (vac === 'nao-verificado' && idade > 45)
      avisos.push({ tipo:'vence', dias: 0, texto:'Cartão vacinal não verificado' });

    marcos.forEach(m => {
      if (m.st === 'aberto')
        avisos.push({ tipo:'vence', dias: m.vence, texto:`Consulta de ${m.rotulo}` });
      else if (m.st === 'perdido' && !todos.some(a => a.dias > m.fim))
        avisos.push({ tipo:'atraso', dias: m.atraso, texto:`Consulta de ${m.rotulo} não realizada` });
      else if (m.st === 'feito' && !m.comAntropo)
        avisos.push({ tipo:'vence', dias: 999, texto:`Sem peso/altura na consulta de ${m.rotulo}` });
    });
  }

  let status;
  if (feitos === 9 && antropos === 9) status = 'completo';
  else if (idade > LIMITE_ACOMP) status = 'encerrado';
  else if (avisos.some(a => a.tipo === 'atraso')) status = 'atrasado';
  else if (avisos.length) status = 'atencao';
  else status = 'em-dia';

  return { idade, marcos, feitos, antropos, esperados, consulta30, visita30, visita6m,
           vac, praticas, avisos, status, todos, visitasACS };
}

const ROTULO_STATUS = {
  'em-dia':'Em dia', 'atencao':'A vencer', 'atrasado':'Em atraso',
  'completo':'Completa', 'encerrado':'Encerrada'
};
const ROTULO_VAC = { 'em-dia':'Vacinas em dia', 'atraso':'Vacinas em atraso', 'nao-verificado':'Cartão não verificado' };

function proximoPasso(av) {
  const reais = av.avisos.filter(a => a.dias !== 999);
  if (reais.length) {
    const a = [...reais].sort((x,y) =>
      (x.tipo==='atraso'?0:1) - (y.tipo==='atraso'?0:1) || x.dias - y.dias)[0];
    if (a.dias === 0) return a.texto;
    return a.tipo === 'atraso' ? `${a.texto} · há ${a.dias}d` : `${a.texto} · em ${a.dias}d`;
  }
  if (av.avisos.length) return av.avisos[0].texto;
  const prox = av.marcos.find(m => m.st === 'futuro');
  if (prox) return `${prox.rotulo} abre em ${prox.ini - av.idade}d`;
  return '—';
}

/* ── Sessão e dados ────────────────────────────────────────────── */
async function entrar(ev) {
  ev.preventDefault();
  const r = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ senha: document.getElementById('senha').value })
  });
  if (r.ok) carregar();
  else toast('Senha incorreta.', true);
}

async function sair() { await fetch('/api/logout', { method:'POST' }); location.reload(); }

async function carregar() {
  const r = await fetch('/api/admin/pacientes');
  if (!r.ok) return;
  P = await r.json();
  if (!Array.isArray(P.criancas)) P.criancas = [];
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('ativo');
  render();
}

async function salvar() {
  const r = await fetch('/api/admin/pacientes', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(P)
  });
  if (r.ok) toast('Salvo.');
  else toast('Erro ao salvar.', true);
}

function toast(msg, erro = false) {
  const t = document.getElementById('aviso-toast');
  t.textContent = msg;
  t.className = 'visivel' + (erro ? ' erro' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => (t.className = ''), 2600);
}

/* ── Render ────────────────────────────────────────────────────── */
function render() {
  const totalAvisos = P.criancas.reduce((s, c) => s + avaliar(c).avisos.length, 0);
  document.getElementById('abas').innerHTML = `
    <button class="${VIEW==='visao'?'ativa':''}" onclick="VIEW='visao'; SEL=null; render()">
      Visão geral${totalAvisos ? `<span class="badge">${totalAvisos}</span>` : ''}
    </button>
    <button class="${VIEW==='lista'||VIEW==='crianca'?'ativa':''}" onclick="VIEW='lista'; SEL=null; render()">Crianças</button>
    <button class="${VIEW==='form'?'ativa':''}" onclick="VIEW='form'; EDITANDO=null; render()">+ Cadastrar</button>`;

  const alvo = document.getElementById('conteudo');
  if (VIEW === 'visao') alvo.innerHTML = telaVisao();
  else if (VIEW === 'lista') alvo.innerHTML = telaLista();
  else if (VIEW === 'form') alvo.innerHTML = telaForm();
  else if (VIEW === 'crianca') alvo.innerHTML = telaCrianca();
}

/* ── Visão geral ───────────────────────────────────────────────── */
function donut(segs) {
  const total = segs.reduce((s, x) => s + x.n, 0);
  const C = 2 * Math.PI * 62;
  let off = 0, arcos = '';
  segs.forEach(s => {
    if (!s.n) return;
    const len = s.n / (total || 1) * C;
    arcos += `<circle r="62" cx="80" cy="80" fill="none" stroke="${s.cor}" stroke-width="24"
      stroke-dasharray="${len - 1.5} ${C - len + 1.5}" stroke-dashoffset="${-off}"
      transform="rotate(-90 80 80)"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 160 160" width="170" role="img" aria-label="Situação das crianças">
    ${arcos || `<circle r="62" cx="80" cy="80" fill="none" stroke="#EFE7DA" stroke-width="24"/>`}
    <text x="80" y="78" text-anchor="middle" font-size="30" font-family="Fraunces,serif" fill="#17251F">${total}</text>
    <text x="80" y="98" text-anchor="middle" font-size="10" fill="#5D6E66">CRIANÇAS</text>
  </svg>`;
}

function telaVisao() {
  const avs = P.criancas.map(c => ({ c, av: avaliar(c) }));
  const conta = st => avs.filter(x => x.av.status === st).length;
  const emDia = conta('em-dia'), atencao = conta('atencao'),
        atrasado = conta('atrasado'), completo = conta('completo'), encerrado = conta('encerrado');

  // percentual por prática, somando feito/devido de todas as crianças
  const indicadores = PRATICAS.map(pr => {
    let feito = 0, devido = 0;
    avs.forEach(({ av }) => { feito += av.praticas[pr.id].feito; devido += av.praticas[pr.id].devido; });
    return { ...pr, feito, devido, valor: pct(feito, devido) };
  });
  const validos = indicadores.filter(i => i.valor !== null);
  const geral = validos.length ? Math.round(validos.reduce((s, i) => s + i.valor, 0) / validos.length) : 0;
  const corPct = v => v >= 70 ? '#1E5340' : v >= 40 ? '#9A6F23' : '#A34A31';

  const avisos = avs.flatMap(({ c, av }) => av.avisos.filter(a => a.dias !== 999).map(a => ({ ...a, c })))
    .sort((x, y) => (x.tipo === 'atraso' ? 0 : 1) - (y.tipo === 'atraso' ? 0 : 1) ||
                    (x.tipo === 'atraso' ? y.dias - x.dias : x.dias - y.dias));

  return `
    <div class="cartoes">
      <div class="cartao"><span>Em acompanhamento</span><strong>${P.criancas.length}</strong><small>crianças até 2 anos</small></div>
      <div class="cartao cor-verde"><span>Em dia</span><strong>${emDia + completo}</strong><small>${completo} com acompanhamento completo</small></div>
      <div class="cartao cor-ocre"><span>A vencer</span><strong>${atencao}</strong><small>janela aberta</small></div>
      <div class="cartao cor-erro"><span>Em atraso</span><strong>${atrasado}</strong><small>precisam de busca ativa</small></div>
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Indicadores por prática</h2>
        <div style="display:flex; align-items:baseline; gap:.6rem">
          <span class="dica">geral</span>
          <strong style="font-family:'Fraunces',serif; font-size:2rem; color:${corPct(geral)}">${geral}%</strong>
        </div>
      </div>
      ${indicadores.map(i => `
        <div style="display:grid; grid-template-columns:1fr auto; gap:.4rem 1rem; align-items:center; padding:.85rem 0; border-bottom:1px solid var(--areia-2)">
          <div>
            <div style="font-size:.92rem; margin-bottom:.45rem">${esc(i.rotulo)}</div>
            <div class="trilho" style="height:7px; background:var(--areia-2); border-radius:100px; overflow:hidden">
              <i style="display:block; height:100%; width:${i.valor ?? 0}%; background:${corPct(i.valor ?? 0)}; border-radius:100px; transition:width 600ms cubic-bezier(.22,.61,.36,1)"></i>
            </div>
          </div>
          <div style="text-align:right; min-width:96px">
            <strong style="font-family:'Fraunces',serif; font-size:1.35rem; color:${corPct(i.valor ?? 0)}">${i.valor === null ? '—' : i.valor + '%'}</strong>
            <small style="display:block; font-size:.72rem; color:var(--texto-suave)">${i.feito} de ${i.devido}</small>
          </div>
        </div>`).join('')}
      <p class="dica" style="margin-top:1rem">
        Cada prática compara o que foi feito com o que já era devido para a idade de cada criança.
        O geral é a média das cinco.
      </p>
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Atendidas × com pendência</h2>
        <span class="dica">situação de hoje, ${fmt(dataISO(HOJE))}</span>
      </div>
      <div class="visao-grid">
        ${donut([
          { n: completo,  cor: '#4A8570' },
          { n: emDia,     cor: '#1E5340' },
          { n: atencao,   cor: '#C9964F' },
          { n: atrasado,  cor: '#A34A31' },
          { n: encerrado, cor: '#C9BFAE' }
        ])}
        <div class="legenda">
          <span><i style="background:#4A8570"></i>Acompanhamento completo — <strong>${completo}</strong></span>
          <span><i style="background:#1E5340"></i>Em dia — <strong>${emDia}</strong></span>
          <span><i style="background:#C9964F"></i>A vencer — <strong>${atencao}</strong></span>
          <span><i style="background:#A34A31"></i>Em atraso — <strong>${atrasado}</strong></span>
          ${encerrado ? `<span><i style="background:#C9BFAE"></i>Encerradas sem completar — <strong>${encerrado}</strong></span>` : ''}
          <span class="dica" style="margin-top:.4rem">${emDia + completo} atendida${emDia+completo===1?'':'s'} em dia · ${atencao + atrasado} com pendência</span>
        </div>
      </div>
    </div>

    <div class="bloco">
      <div class="bloco-topo">
        <h2>Avisos</h2>
        <span class="dica">${avisos.length ? avisos.length + ' pendência' + (avisos.length>1?'s':'') : 'nenhuma pendência'}</span>
      </div>
      ${avisos.length ? avisos.map(a => `
        <div class="aviso-item ${a.tipo}" onclick="abrirCrianca('${a.c.id}')">
          <strong>${esc(a.c.nome)}</strong>
          <span>${esc(a.texto)}</span>
          <span class="aviso-etq">${a.dias === 0 ? (a.tipo==='atraso'?'pendente':'verificar')
            : a.tipo === 'atraso' ? `atrasada há ${a.dias}d` : `vence em ${a.dias}d`}</span>
        </div>`).join('') : '<p class="dica">Todas as crianças estão em dia.</p>'}
    </div>`;
}

/* ── Lista ─────────────────────────────────────────────────────── */
function telaLista() {
  const ordem = { atrasado:0, atencao:1, 'em-dia':2, completo:3, encerrado:4 };
  let linhas = P.criancas.map(c => ({ c, av: avaliar(c) }))
    .sort((x, y) => ordem[x.av.status] - ordem[y.av.status] || x.av.idade - y.av.idade);
  const termo = BUSCA.trim().toLowerCase();
  if (termo) linhas = linhas.filter(({ c }) =>
    (c.nome + ' ' + (c.mae || '')).toLowerCase().includes(termo));

  return `
    <div class="bloco">
      <div class="bloco-topo">
        <h2>Crianças</h2>

/* ── Detalhe da criança ────────────────────────────────────────── */

              `Visita ACS com ${av.visita30.dias} dia${av.visita30.dias===1?'':'s'}`,
              `Visita ACS: faltam ${av.visita30.vence} dia${av.visita30.vence===1?'':'s'}`,
              'Visita ACS de 30 dias não realizada')}

        <span class="badge30 ${av.vac === 'em-dia' ? 'ok' : av.vac === 'atraso' ? 'falhou' : 'pend'}">
          ${av.vac === 'em-dia' ? '✓' : av.vac === 'atraso' ? '✕' : '⏱'} ${ROTULO_VAC[av.vac]}
        </span>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1.5rem; padding-top:1.2rem; border-top:1px solid var(--areia-2)">
        <div>

            <div class="trilho" style="height:8px"><i style="width:${(av.feitos/9*100).toFixed(0)}%"></i></div>
            <small><strong>${av.feitos}</strong>/9</small>

          <span class="dica">consultas de puericultura</span>
        </div>
        <div>
          <div class="mini-prog" style="margin-bottom:.35rem">
            <div class="trilho" style="height:8px"><i style="width:${(av.antropos/9*100).toFixed(0)}%; background:var(--rose)"></i></div>
            <small><strong>${av.antropos}</strong>/9</small>
          </div>
          <span class="dica">com peso e altura</span>
        </div>
        <div>
          <span class="dica">esperadas para a idade</span>
          <div style="font-family:'Fraunces',serif; font-size:1.5rem; margin-top:.2rem">${av.esperados}</div>
        </div>

    </div>

    <div class="bloco">
      <div class="bloco-topo"><h2>Práticas desta criança</h2></div>
      ${pctCrianca.map(i => `
        <div style="display:grid; grid-template-columns:1fr auto; gap:.4rem 1rem; align-items:center; padding:.7rem 0; border-bottom:1px solid var(--areia-2)">
          <div>
            <div style="font-size:.9rem; margin-bottom:.4rem">${esc(i.rotulo)}</div>
            <div class="trilho" style="height:6px; background:var(--areia-2); border-radius:100px; overflow:hidden">
              <i style="display:block; height:100%; width:${i.valor ?? 0}%; background:${corPct(i.valor ?? 0)}; border-radius:100px"></i>
            </div>

            <tr>
              <td>${fmt(a.data)}</td>

              <td>${a.peso != null && a.peso !== '' ? esc(a.peso) + ' kg' : '—'}</td>
              <td>${a.altura != null && a.altura !== '' ? esc(a.altura) + ' cm' : '—'}</td>
              <td style="color:var(--texto-suave)">${esc(a.obs || '—')}</td>
              <td style="text-align:right"><button class="btn btn-remover" onclick="excluirAtendimento('${c.id}', ${a.ix})">×</button></td>

async function registrarAtendimento(id) {
  const c = P.criancas.find(x => x.id === id);
  const data = document.getElementById('at-data').value;
  if (!data) return toast('Informe a data.', true);
  if (data < c.nascimento) return toast('Data anterior ao nascimento.', true);
  const peso = document.getElementById('at-peso').value;
  const altura = document.getElementById('at-altura').value;
  const reg = {
    data,
    tipo: document.getElementById('at-tipo').value,
    obs: document.getElementById('at-obs').value.trim()
  };
  if (peso !== '') reg.peso = parseFloat(peso);
  if (altura !== '') reg.altura = parseFloat(altura);
  c.atendimentos = c.atendimentos || [];
  c.atendimentos.push(reg);
  await salvar();
  render();
}

async function excluirAtendimento(id, ix) {
  if (!confirm('Excluir este registro?')) return;
  const c = P.criancas.find(x => x.id === id);
  c.atendimentos.splice(ix, 1);
  await salvar();
  render();
}

async function excluirCrianca(id) {
  const c = P.criancas.find(x => x.id === id);
  if (!confirm(`Excluir ${c.nome} e todo o histórico?`)) return;
  P.criancas = P.criancas.filter(x => x.id !== id);
  SEL = null; VIEW = 'lista';
  await salvar();
  render();
}

/* ── Cadastro / edição ─────────────────────────────────────────── */

  return `
    <div class="bloco" style="max-width:640px">

        <div class="campo"><label>Nome completo</label><input id="f-nome" value="${esc(c?.nome || '')}" /></div>
        <div class="campo"><label>Nascimento</label><input type="date" id="f-nasc" max="${dataISO(HOJE)}" value="${esc(c?.nascimento || '')}" /></div>
        <div class="campo"><label>Sexo</label>
          <select id="f-sexo">
            <option value="F" ${c?.sexo==='F'?'selected':''}>Feminino</option>
            <option value="M" ${c?.sexo==='M'?'selected':''}>Masculino</option>
          </select>
        </div>
        <div class="campo"><label>Nome da mãe</label><input id="f-mae" value="${esc(c?.mae || '')}" /></div>
        <div class="campo"><label>Telefone</label><input id="f-tel" value="${esc(c?.telefone || '')}" /></div>
        <div class="campo"><label>Microárea</label><input id="f-micro" value="${esc(c?.microarea || '')}" /></div>
      </div>
      <div class="grid2">
        <div class="campo"><label>Situação vacinal</label>
          <select id="f-vac">
            <option value="nao-verificado" ${(c?.vacinas?.situacao||'nao-verificado')==='nao-verificado'?'selected':''}>Não verificado</option>
            <option value="em-dia" ${c?.vacinas?.situacao==='em-dia'?'selected':''}>Em dia</option>
            <option value="atraso" ${c?.vacinas?.situacao==='atraso'?'selected':''}>Em atraso</option>
          </select>
        </div>
        <div class="campo"><label>Verificado em</label>
          <input type="date" id="f-vacdata" max="${dataISO(HOJE)}" value="${esc(c?.vacinas?.verificadoEm || '')}" />
        </div>
      </div>
      <div class="campo"><label>Observações</label><textarea id="f-obs" rows="3">${esc(c?.obs || '')}</textarea></div>
      <div style="display:flex; gap:.7rem">
        <button class="btn btn-verde" onclick="salvarCrianca()">${c ? 'Salvar alterações' : 'Cadastrar'}</button>
        ${c ? `<button class="btn btn-linha" onclick="VIEW='crianca'; SEL='${c.id}'; EDITANDO=null; render()">Cancelar</button>` : ''}
      </div>
    </div>`;
}

async function salvarCrianca() {
  const nome = document.getElementById('f-nome').value.trim();
  const nasc = document.getElementById('f-nasc').value;
  if (!nome || !nasc) return toast('Nome e nascimento são obrigatórios.', true);
  const dados = {
    nome, nascimento: nasc,
    sexo: document.getElementById('f-sexo').value,
    mae: document.getElementById('f-mae').value.trim(),
    telefone: document.getElementById('f-tel').value.trim(),
    microarea: document.getElementById('f-micro').value.trim(),
    obs: document.getElementById('f-obs').value.trim(),
    vacinas: {
      situacao: document.getElementById('f-vac').value,
      verificadoEm: document.getElementById('f-vacdata').value
    }
  };
  if (EDITANDO) {
    Object.assign(P.criancas.find(x => x.id === EDITANDO), dados);
    SEL = EDITANDO; EDITANDO = null; VIEW = 'crianca';
  } else {
    const nova = { id: 'c' + Date.now(), ...dados, atendimentos: [] };
    P.criancas.push(nova);
    SEL = nova.id; VIEW = 'crianca';
  }
  await salvar();
  render();
}

// sessão ativa entra direto
fetch('/api/sessao').then(r => r.json()).then(j => { if (j.autenticado) carregar(); });
</script>
</body>
</html>
