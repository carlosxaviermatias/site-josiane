<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Área restrita — Josiane Tavares</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde-900:#0B1F17; --verde-800:#12352A; --verde-600:#1E5340; --verde-400:#4A8570;
    --areia:#F7F3EC; --areia-2:#EFE7DA; --areia-3:#E3D8C6;
    --rose:#B87F6C; --texto:#17251F; --texto-suave:#5D6E66;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family:'Inter',sans-serif; font-size:15px;
    background:var(--areia); color:var(--texto);
  }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; font-weight:400; margin:0 0 .5em; }

  /* ── Login ─────────────────────────────────────── */
  #login {
    min-height:100vh; display:grid; place-items:center; padding:2rem;
    background:var(--verde-800);
  }
  .login-card {
    width:min(400px,100%); background:var(--areia);
    padding:3rem 2.5rem; border-radius:4px;
  }
  .login-card h1 { font-size:1.7rem; color:var(--verde-800); }
  .login-card p { color:var(--texto-suave); font-size:.9rem; margin:0 0 2rem; }

  /* ── Painel ────────────────────────────────────── */
  #painel { display:none; min-height:100vh; grid-template-columns:250px 1fr; }
  #painel.ativo { display:grid; }
  aside {
    background:var(--verde-900); color:var(--areia);
    padding:2rem 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  aside .marca { padding:0 1.6rem 1.8rem; border-bottom:1px solid rgba(247,243,236,.12); }
  aside .marca strong { font-family:'Fraunces',serif; font-weight:400; font-size:1.25rem; display:block; }
  aside .marca span { font-size:.65rem; letter-spacing:.18em; text-transform:uppercase; color:var(--rose); }
  .abas { display:flex; flex-direction:column; padding:1.2rem 0; }
  .abas button {
    background:none; border:0; text-align:left; cursor:pointer;
    padding:.8rem 1.6rem; font:inherit; font-size:.88rem;
    color:rgba(247,243,236,.62); border-left:3px solid transparent;
    transition:180ms;
  }
  .abas button:hover { color:var(--areia); background:rgba(247,243,236,.05); }
  .abas button.ativa { color:var(--areia); border-left-color:var(--rose); background:rgba(247,243,236,.07); }
  .abas .sair { margin-top:1.5rem; color:var(--rose); }

  main { padding:2.5rem clamp(1.5rem,4vw,3.5rem) 6rem; max-width:960px; }
  .topo { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:2.5rem; flex-wrap:wrap; }
  .topo h2 { font-size:1.8rem; margin:0; color:var(--verde-800); }
  .topo .acoes { display:flex; gap:.7rem; align-items:center; }

  /* ── Formulários ───────────────────────────────── */
  .campo { margin-bottom:1.4rem; }
  .campo label {
    display:block; font-size:.7rem; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase;
    color:var(--texto-suave); margin-bottom:.5rem;
  }
  input[type=text], input[type=password], input[type=date], textarea, select {
    width:100%; padding:.75rem .9rem; font:inherit; font-size:.93rem;
    background:#fff; border:1px solid var(--areia-3); border-radius:3px;
    color:var(--texto); transition:160ms;
  }
  input:focus, textarea:focus { outline:none; border-color:var(--verde-400); box-shadow:0 0 0 3px rgba(74,133,112,.14); }
  textarea { resize:vertical; min-height:120px; line-height:1.7; font-family:inherit; }
  textarea.alto { min-height:340px; }
  .dica { font-size:.78rem; color:var(--texto-suave); margin:.4rem 0 0; }

  .bloco {
    background:#fff; border:1px solid var(--areia-3);
    border-radius:4px; padding:1.8rem; margin-bottom:1.3rem;
  }
  .bloco-topo { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.4rem; }
  .bloco-topo strong { font-size:.95rem; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 1.2rem; }

  button.btn {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.7rem 1.4rem; font:inherit; font-size:.75rem; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase;
    border:1px solid transparent; border-radius:3px; cursor:pointer; transition:180ms;
  }
  .btn-verde { background:var(--verde-800); color:var(--areia); }
  .btn-verde:hover { background:var(--verde-600); }
  .btn-linha { background:transparent; border-color:var(--areia-3); color:var(--texto-suave); }
  .btn-linha:hover { border-color:var(--verde-600); color:var(--verde-600); }
  .btn-remover { background:transparent; border-color:#E5C4BC; color:#A5573F; padding:.45rem .9rem; font-size:.68rem; }
  .btn-remover:hover { background:#FBEFEC; }
  .btn-largo { width:100%; justify-content:center; padding:.9rem; }

  .foto-campo { display:flex; gap:1rem; align-items:flex-start; }
  .foto-preview {
    width:92px; height:92px; flex:none; border-radius:3px;
    background:var(--areia-2); border:1px solid var(--areia-3);
    object-fit:cover; display:block;
  }
  .foto-campo > div { flex:1; }

  #aviso {
    position:fixed; right:1.5rem; bottom:1.5rem; z-index:50;
    padding:.9rem 1.4rem; border-radius:3px; font-size:.88rem; font-weight:500;
    background:var(--verde-800); color:var(--areia);
    box-shadow:0 12px 30px rgba(11,31,23,.25);
    opacity:0; transform:translateY(12px); pointer-events:none; transition:220ms;
  }
  #aviso.visivel { opacity:1; transform:translateY(0); }
  #aviso.erro { background:#8C3F2A; }

  @media (max-width:820px) {
    #painel.ativo { grid-template-columns:1fr; }
    aside { position:static; height:auto; padding:1.2rem 0 0; }
    .grid2 { grid-template-columns:1fr; }

    /* O menu vertical ocupava a tela inteira antes do conteúdo aparecer.
       No celular ele vira uma faixa de abas que rola na horizontal. */
    aside .marca { padding:0 1.2rem 1rem; }
    .abas {
      flex-direction:row; overflow-x:auto; padding:.6rem .8rem;
      gap:.4rem; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .abas::-webkit-scrollbar { display:none; }
    .abas button {
      white-space:nowrap; padding:.55rem 1rem; border-left:0;
      border-radius:100px; border:1px solid rgba(247,243,236,.18); font-size:.82rem;
    }
    .abas button.ativa { border-left:0; border-color:var(--rose); background:rgba(247,243,236,.12); }
    .abas .sair { margin-top:0; }
    main { padding:1.6rem 1.1rem 4rem; }
    .topo h2 { font-size:1.4rem; }
    input, select, textarea { font-size:16px; }  /* evita o zoom automático do iOS */
  }
</style>
</head>
<body>

<!-- ═════════════════════════════════════════ LOGIN -->
<div id="login">
  <form class="login-card" onsubmit="entrar(event)">
    <h1>Área restrita</h1>
    <p>Painel de conteúdo do site.</p>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required />
    </div>
    <button class="btn btn-verde btn-largo" type="submit">Entrar</button>
  </form>
</div>

<!-- ═════════════════════════════════════════ PAINEL -->
<div id="painel">
  <aside>
    <div class="marca">
      <strong>Josiane Tavares</strong>
      <span>Painel</span>
    </div>
    <nav class="abas" id="abas"></nav>
  </aside>
  <main>
    <div class="topo">
      <h2 id="aba-titulo"></h2>
      <div class="acoes">
        <a class="btn btn-linha" href="/" target="_blank" style="text-decoration:none">Ver o site</a>
        <button class="btn btn-verde" onclick="salvar()">Salvar alterações</button>
      </div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<div id="aviso"></div>

<script>
let D = null;
let ABA = 'config';

const ABAS = [
  ['config',     'Dados gerais'],
  ['hero',       'Topo do site'],
  ['pilares',    'Pilares'],
  ['sobre',      'Sobre'],
  ['temas',      'Saúde da mulher'],
  ['enfermagem', 'Enfermagem geral'],
  ['alerta',     'Sinais de alerta'],
  ['artigos',    'Artigos'],
  ['faq',        'Dúvidas (FAQ)'],
  ['indicacoes', 'Indicações'],
  ['rodape',     'Rodapé']
];

// ── Utilitários ──────────────────────────────────────────────
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function get(caminho) {
  return caminho.split('.').reduce((o, k) => (o == null ? o : o[/^\d+$/.test(k) ? Number(k) : k]), D);
}
function set(caminho, valor) {
  const partes = caminho.split('.');
  const chave = partes.pop();
  const alvo = partes.reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], D);
  alvo[/^\d+$/.test(chave) ? Number(chave) : chave] = valor;
}

function avisar(msg, erro = false) {
  const a = document.getElementById('aviso');
  a.textContent = msg;
  a.className = 'visivel' + (erro ? ' erro' : '');
  clearTimeout(a._t);
  a._t = setTimeout(() => (a.className = ''), 3200);
}

// ── Campos ───────────────────────────────────────────────────
function texto(rotulo, caminho, dica = '') {
  return `<div class="campo">
    <label>${esc(rotulo)}</label>
    <input type="text" value="${esc(get(caminho))}" oninput="set('${caminho}', this.value)" />
    ${dica ? `<p class="dica">${esc(dica)}</p>` : ''}
  </div>`;
}

function area(rotulo, caminho, alto = false, dica = '') {
  return `<div class="campo">
    <label>${esc(rotulo)}</label>
    <textarea class="${alto ? 'alto' : ''}" oninput="set('${caminho}', this.value)">${esc(get(caminho))}</textarea>
    ${dica ? `<p class="dica">${esc(dica)}</p>` : ''}
  </div>`;
}

function imagem(rotulo, caminho) {
  const v = get(caminho) || '';
  return `<div class="campo">
    <label>${esc(rotulo)}</label>
    <div class="foto-campo">
      <img class="foto-preview" src="${esc(v) || 'data:image/gif;base64,R0lGODlhAQABAAAAACw='}" alt="" />
      <div>
        <input type="text" value="${esc(v)}"
          oninput="set('${caminho}', this.value); this.closest('.foto-campo').querySelector('img').src = this.value" />
        <p class="dica">Cole o caminho da imagem ou envie um arquivo abaixo.</p>
        <input type="file" accept="image/*" style="margin-top:.5rem; font-size:.82rem"
          onchange="enviarImagem(this, '${caminho}')" />
      </div>
    </div>
  </div>`;
}

async function enviarImagem(input, caminho) {
  if (!input.files || !input.files[0]) return;
  const fd = new FormData();
  fd.append('imagem', input.files[0]);
  avisar('Enviando imagem...');
  try {
    const r = await fetch('/api/admin/upload', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || 'Falha no envio');
    set(caminho, j.caminho);
    render();
    avisar('Imagem enviada. Não esqueça de salvar.');
  } catch (e) {
    avisar(e.message, true);
  }
}

// ── Listas (adicionar / remover / mover) ─────────────────────
function addItem(caminho, modelo) {
  get(caminho).push(JSON.parse(JSON.stringify(modelo)));
  render();
}
function delItem(caminho, i) {
  if (!confirm('Remover este item?')) return;
  get(caminho).splice(i, 1);
  render();
}
function moveItem(caminho, i, dir) {
  const lista = get(caminho);
  const j = i + dir;
  if (j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
  render();
}
function controlesLista(caminho, i, total) {
  return `<div style="display:flex; gap:.4rem">
    ${i > 0 ? `<button class="btn btn-remover" style="border-color:var(--areia-3); color:var(--texto-suave)" onclick="moveItem('${caminho}',${i},-1)">↑</button>` : ''}
    ${i < total - 1 ? `<button class="btn btn-remover" style="border-color:var(--areia-3); color:var(--texto-suave)" onclick="moveItem('${caminho}',${i},1)">↓</button>` : ''}
    <button class="btn btn-remover" onclick="delItem('${caminho}',${i})">Remover</button>
  </div>`;
}

// ── Renderização das abas ────────────────────────────────────
function render() {
  document.getElementById('abas').innerHTML = ABAS.map(([id, nome]) =>
    `<button class="${id === ABA ? 'ativa' : ''}" onclick="ABA='${id}'; render()">${nome}</button>`
  ).join('') + `<button class="sair" onclick="sair()">Sair</button>`;

  document.getElementById('aba-titulo').textContent = (ABAS.find(a => a[0] === ABA) || [, ''])[1];
  document.getElementById('conteudo').innerHTML = TELAS[ABA]();
}

const TELAS = {
  config: () => `<div class="bloco">
    <div class="grid2">
      ${texto('Nome', 'config.nome')}
      ${texto('Como aparece no site', 'config.titulo')}
      ${texto('Profissão', 'config.profissao')}
      ${texto('Especialidade', 'config.especialidade')}
      ${texto('COREN', 'config.coren')}
      ${texto('Cidade / UF', 'config.cidade')}
      ${texto('E-mail', 'config.email')}
      ${texto('Instagram (URL)', 'config.instagram')}
    </div>
  </div>`,

  hero: () => `<div class="bloco">
    ${texto('Etiqueta pequena', 'hero.tagline')}
    ${area('Título principal', 'hero.titulo')}
    ${area('Subtítulo', 'hero.subtitulo')}
    <div class="grid2">
      ${texto('Texto do botão', 'hero.ctaTexto')}
      ${texto('Link do botão', 'hero.ctaLink', 'Ex.: #temas ou /artigos')}
    </div>
    ${imagem('Foto do topo', 'hero.foto')}
  </div>`,

  pilares: () => `<div class="bloco">${texto('Título da seção', 'pilares.titulo')}</div>` +
    D.pilares.itens.map((p, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>Pilar ${i + 1}</strong>${controlesLista('pilares.itens', i, D.pilares.itens.length)}</div>
      <div class="campo">
        <label>Ícone</label>
        <select onchange="set('pilares.itens.${i}.icone', this.value)">
          ${['gestacao', 'puerperio', 'preventivo', 'padrao'].map(o =>
            `<option value="${o}" ${p.icone === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
      ${texto('Título', `pilares.itens.${i}.titulo`)}
      ${area('Texto', `pilares.itens.${i}.texto`)}
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('pilares.itens', {icone:'padrao',titulo:'Novo pilar',texto:''})">+ Adicionar pilar</button>`,

  sobre: () => `<div class="bloco">
    ${texto('Etiqueta', 'sobre.label')}
    ${area('Título', 'sobre.titulo')}
    ${imagem('Foto', 'sobre.foto')}
  </div>` +
    D.sobre.paragrafos.map((_, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>Parágrafo ${i + 1}</strong>${controlesLista('sobre.paragrafos', i, D.sobre.paragrafos.length)}</div>
      ${area('', `sobre.paragrafos.${i}`)}
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('sobre.paragrafos', '')">+ Adicionar parágrafo</button>`,

  temas: () => D.temas.map((t, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>${esc(t.titulo)}</strong>${controlesLista('temas', i, D.temas.length)}</div>
      <div class="grid2">
        ${texto('Título', `temas.${i}.titulo`)}
        ${texto('Endereço (id)', `temas.${i}.id`, 'Só letras minúsculas e hífens. Ex.: pre-natal')}
      </div>
      ${area('Resumo', `temas.${i}.resumo`)}
      ${imagem('Imagem', `temas.${i}.imagem`)}
      ${area('Conteúdo', `temas.${i}.conteudo`, true, 'Linha inteira entre ** vira subtítulo. **Assim** no meio do texto vira negrito. Linha em branco separa parágrafos.')}
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('temas', {id:'novo-tema',titulo:'Novo tema',resumo:'',imagem:'',conteudo:''})">+ Adicionar tema</button>`,

  enfermagem: () => `<div class="bloco">
    ${texto('Etiqueta', 'enfermagem.label')}
    ${area('Título', 'enfermagem.titulo')}
    ${area('Texto de abertura', 'enfermagem.texto')}
  </div>` +
    D.enfermagem.itens.map((_, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>Item ${i + 1}</strong>${controlesLista('enfermagem.itens', i, D.enfermagem.itens.length)}</div>
      ${texto('Título', `enfermagem.itens.${i}.titulo`)}
      ${area('Texto', `enfermagem.itens.${i}.texto`)}
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('enfermagem.itens', {titulo:'Novo item',texto:''})">+ Adicionar item</button>`,

  alerta: () => `<div class="bloco">
    ${area('Título', 'alerta.titulo')}
    ${area('Subtítulo', 'alerta.subtitulo')}
    ${area('Rodapé do bloco', 'alerta.rodape')}
  </div>
  <div class="bloco">
    <div class="bloco-topo"><strong>Sinais listados</strong></div>
    ${D.alerta.itens.map((_, i) => `<div style="display:flex; gap:.7rem; align-items:flex-start; margin-bottom:.7rem">
      <input type="text" value="${esc(D.alerta.itens[i])}" oninput="set('alerta.itens.${i}', this.value)" />
      <button class="btn btn-remover" style="flex:none" onclick="delItem('alerta.itens',${i})">×</button>
    </div>`).join('')}
    <button class="btn btn-linha btn-largo" style="margin-top:1rem" onclick="addItem('alerta.itens','')">+ Adicionar sinal</button>
  </div>`,

  artigos: () => D.artigos.map((a, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>${esc(a.titulo)}</strong>${controlesLista('artigos', i, D.artigos.length)}</div>
      <div class="grid2">
        ${texto('Título', `artigos.${i}.titulo`)}
        ${texto('Endereço (slug)', `artigos.${i}.slug`, 'Só letras minúsculas e hífens.')}
      </div>
      <div class="grid2">
        <div class="campo">
          <label>Data</label>
          <input type="date" value="${esc(a.data)}" oninput="set('artigos.${i}.data', this.value)" />
        </div>
        <div class="campo">
          <label>Situação</label>
          <select onchange="set('artigos.${i}.publicado', this.value === 'sim')">
            <option value="sim" ${a.publicado !== false ? 'selected' : ''}>Publicado</option>
            <option value="nao" ${a.publicado === false ? 'selected' : ''}>Rascunho (oculto)</option>
          </select>
        </div>
      </div>
      ${area('Resumo', `artigos.${i}.resumo`)}
      ${imagem('Imagem', `artigos.${i}.imagem`)}
      ${area('Conteúdo', `artigos.${i}.conteudo`, true, 'Linha inteira entre ** vira subtítulo. Linha em branco separa parágrafos.')}
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('artigos', {slug:'novo-artigo',titulo:'Novo artigo',resumo:'',data:new Date().toISOString().slice(0,10),imagem:'',publicado:false,conteudo:''})">+ Adicionar artigo</button>`,

  faq: () => `<div class="bloco">
    ${texto('Título da página', 'faq.titulo')}
    ${area('Subtítulo', 'faq.subtitulo')}
    ${area('Aviso do rodapé', 'faq.aviso')}
  </div>

  <div class="bloco">
    <div class="bloco-topo"><strong>Marcos do pré-natal</strong></div>
    <p class="dica" style="margin:-.6rem 0 1.4rem">Aparecem na calculadora, conforme a semana informada pela visitante.</p>
    ${D.faq.marcos.map((m, i) => `
      <div style="border-top:1px solid var(--areia-3); padding-top:1.2rem; margin-top:1.2rem">
        <div class="bloco-topo"><strong>${esc(m.titulo)}</strong>${controlesLista('faq.marcos', i, D.faq.marcos.length)}</div>
        <div class="grid2">
          <div class="campo">
            <label>Da semana</label>
            <input type="text" value="${esc(m.de)}" oninput="set('faq.marcos.${i}.de', parseInt(this.value) || 0)" />
          </div>
          <div class="campo">
            <label>Até a semana</label>
            <input type="text" value="${esc(m.ate)}" oninput="set('faq.marcos.${i}.ate', parseInt(this.value) || 0)" />
          </div>
        </div>
        ${texto('Título', `faq.marcos.${i}.titulo`)}
        ${area('Texto', `faq.marcos.${i}.texto`)}
      </div>`).join('')}
    <button class="btn btn-linha btn-largo" style="margin-top:1.4rem" onclick="addItem('faq.marcos', {de:1,ate:12,titulo:'Novo marco',texto:''})">+ Adicionar marco</button>
  </div>

  ${D.faq.perguntas.map((q, i) => `
    <div class="bloco">
      <div class="bloco-topo"><strong>${esc(q.p.slice(0, 60))}${q.p.length > 60 ? '…' : ''}</strong>${controlesLista('faq.perguntas', i, D.faq.perguntas.length)}</div>
      ${area('Pergunta', `faq.perguntas.${i}.p`)}
      ${area('Resposta', `faq.perguntas.${i}.r`, true)}
      <div class="campo">
        <label>Aparece para quem escolher</label>
        <div style="display:flex; gap:1.2rem; flex-wrap:wrap; padding-top:.3rem">
          ${D.faq.fases.map(f => `
            <label style="display:flex; align-items:center; gap:.45rem; font-size:.9rem; text-transform:none; letter-spacing:0; font-weight:400; color:var(--texto); margin:0">
              <input type="checkbox" ${(q.fases || []).includes(f.id) ? 'checked' : ''}
                     onchange="alternarFase(${i}, '${f.id}', this.checked)" />
              ${esc(f.titulo)}
            </label>`).join('')}
        </div>
      </div>
      <div class="campo">
        <label>Tema relacionado (link no fim da resposta)</label>
        <select onchange="set('faq.perguntas.${i}.tema', this.value)">
          <option value="">— nenhum —</option>
          ${D.temas.map(t => `<option value="${esc(t.id)}" ${q.tema === t.id ? 'selected' : ''}>${esc(t.titulo)}</option>`).join('')}
        </select>
      </div>
    </div>`).join('')}
  <button class="btn btn-linha btn-largo" onclick="addItem('faq.perguntas', {p:'Nova pergunta',r:'',fases:[],tema:''})">+ Adicionar pergunta</button>`,

  indicacoes: () => `<div class="bloco">
    ${texto('Título da página', 'indicacoes.titulo')}
    ${area('Subtítulo', 'indicacoes.subtitulo', false, 'É aqui que fica o aviso de link de afiliado.')}
    ${area('Aviso do rodapé', 'indicacoes.aviso')}
  </div>` +
    D.indicacoes.itens.map((it, i) => `<div class="bloco">
      <div class="bloco-topo"><strong>${esc(it.titulo)}</strong>${controlesLista('indicacoes.itens', i, D.indicacoes.itens.length)}</div>
      <div class="grid2">
        ${texto('Título', `indicacoes.itens.${i}.titulo`)}
        ${texto('Categoria', `indicacoes.itens.${i}.categoria`)}
      </div>
      ${area('Descrição', `indicacoes.itens.${i}.descricao`)}
      ${imagem('Imagem', `indicacoes.itens.${i}.imagem`)}
      <div class="grid2">
        ${texto('Link de afiliado', `indicacoes.itens.${i}.link`)}
        ${texto('Texto do botão', `indicacoes.itens.${i}.botao`)}
      </div>
      <div class="campo">
        <label>Situação</label>
        <select onchange="set('indicacoes.itens.${i}.ativo', this.value === 'sim')">
          <option value="sim" ${it.ativo !== false ? 'selected' : ''}>Visível no site</option>
          <option value="nao" ${it.ativo === false ? 'selected' : ''}>Oculto</option>
        </select>
      </div>
    </div>`).join('') +
    `<button class="btn btn-linha btn-largo" onclick="addItem('indicacoes.itens', {titulo:'Nova indicação',categoria:'',descricao:'',imagem:'',link:'',botao:'Ver produto',ativo:false})">+ Adicionar indicação</button>`,

  rodape: () => `<div class="bloco">
    ${area('Aviso legal', 'rodape.aviso', false, 'Aparece no rodapé de todas as páginas.')}
    ${texto('Créditos', 'rodape.creditos')}
  </div>`
};

function alternarFase(i, fase, marcado) {
  const q = D.faq.perguntas[i];
  if (!Array.isArray(q.fases)) q.fases = [];
  if (marcado) { if (!q.fases.includes(fase)) q.fases.push(fase); }
  else q.fases = q.fases.filter(f => f !== fase);
}

// ── Sessão ───────────────────────────────────────────────────
async function entrar(ev) {
  ev.preventDefault();
  const senha = document.getElementById('senha').value;
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ senha })
  });
  if (r.ok) abrirPainel();
  else avisar('Senha incorreta.', true);
}

async function sair() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

async function abrirPainel() {
  const r = await fetch('/api/admin/data');
  if (!r.ok) return avisar('Sessão expirada. Entre novamente.', true);
  D = await r.json();
  document.getElementById('login').style.display = 'none';
  document.getElementById('painel').classList.add('ativo');
  render();
}

async function salvar() {
  try {
    const r = await fetch('/api/admin/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(D)
    });
    if (!r.ok) throw new Error('Não foi possível salvar');
    avisar('Alterações salvas.');
  } catch (e) {
    avisar(e.message, true);
  }
}

// Se a sessão ainda estiver ativa, entra direto.
fetch('/api/sessao').then(r => r.json()).then(j => { if (j.autenticado) abrirPainel(); });
</script>
